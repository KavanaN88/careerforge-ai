// SkillPilot AI — scoring engine (demo mode)
// Mirrors what the real product computes server-side (FastAPI + Gemini API).

function hashString(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

function seededRandom(seed) {
  // simple mulberry32
  let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function clamp(n, min = 0, max = 100) {
  return Math.max(min, Math.min(max, Math.round(n)));
}

/**
 * Evidence-based confidence score for a single skill.
 * Weighted blend: resume mention, github evidence, deployment/project evidence,
 * assessment score (0-10), interview score (0-10).
 */
function computeSkillConfidence(evidence) {
  const {
    resumeMention = false,
    githubProject = false,
    deploymentEvidence = false,
    assessmentScore = null, // 0-10
    interviewScore = null, // 0-10
    claimedOnly = false,
  } = evidence;

  if (claimedOnly && !resumeMention && !githubProject && !deploymentEvidence && assessmentScore === null && interviewScore === null) {
    return { score: clamp(seededRandomRange(evidence.skillId || "x", 10, 25)), breakdown: [] };
  }

  let score = 0;
  const breakdown = [];

  if (resumeMention) { score += 15; breakdown.push({ label: "Mentioned in resume", delta: 15, positive: true }); }
  if (githubProject) { score += 20; breakdown.push({ label: "Used in a GitHub project", delta: 20, positive: true }); }
  if (deploymentEvidence) { score += 20; breakdown.push({ label: "Real deployment / working demo detected", delta: 20, positive: true }); }
  if (assessmentScore !== null) {
    const pts = Math.round((assessmentScore / 10) * 25);
    score += pts;
    breakdown.push({ label: `Technical assessment: ${assessmentScore}/10`, delta: pts, positive: assessmentScore >= 5 });
  }
  if (interviewScore !== null) {
    const pts = Math.round((interviewScore / 10) * 20);
    score += pts;
    breakdown.push({ label: `AI interview: ${interviewScore}/10`, delta: pts, positive: interviewScore >= 5 });
  }

  if (breakdown.length === 0) {
    breakdown.push({ label: "No evidence submitted yet", delta: 0, positive: false });
  }

  return { score: clamp(score), breakdown };
}

function seededRandomRange(seedStr, min, max) {
  const r = seededRandom(hashString(String(seedStr)));
  return min + r * (max - min);
}

function strengthLabel(score) {
  if (score >= 75) return { label: "Strong", color: "good" };
  if (score >= 45) return { label: "Developing", color: "warn" };
  return { label: "Weak", color: "bad" };
}

/**
 * Simulated GitHub analysis. Deterministic per-username so the same
 * username always yields the same "AI analysis" in this demo.
 */
function analyzeGithub(username, careerSkills) {
  const seed = hashString(username.toLowerCase().trim());
  const rnd = (i) => seededRandom(seed + i * 97);

  const repoCount = Math.round(4 + rnd(1) * 28);
  const activityScore = clamp(30 + rnd(2) * 65);
  const docQuality = clamp(30 + rnd(3) * 65);
  const techDiversity = clamp(30 + rnd(4) * 65);
  const projectQuality = clamp(25 + rnd(6) * 70);
  const deploymentEvidenceScore = clamp(15 + rnd(7) * 65); // weakest signal for most portfolios, deliberately
  const languages = ["Python", "JavaScript", "TypeScript", "Go", "Java", "C++", "Shell"]
    .filter((_, i) => rnd(5 + i) > 0.4)
    .slice(0, 5);
  if (languages.length === 0) languages.push("Python");

  const portfolioScore = clamp(
    activityScore * 0.22 + docQuality * 0.18 + techDiversity * 0.18 + projectQuality * 0.22 + deploymentEvidenceScore * 0.1
    + Math.min(repoCount, 20) / 20 * 100 * 0.1
  );

  // Which of the target career's skills does this "portfolio" provide evidence for?
  const evidencedSkills = careerSkills.filter((s, i) => rnd(20 + i) > 0.45).map(s => s.id);

  const sampleProjectNames = ["CloudDeploy", "TaskFlow API", "DataViz Dashboard", "AuthGateway", "InsightPipeline", "EdgeCache"];
  const projects = Array.from({ length: Math.min(3, Math.max(1, Math.round(repoCount / 8))) }).map((_, i) => {
    const evidence = careerSkills.filter((s, j) => rnd(50 + i * 10 + j) > 0.5).map(s => s.name);
    return {
      name: sampleProjectNames[(seed + i) % sampleProjectNames.length],
      stars: Math.round(rnd(70 + i) * 40),
      evidence: evidence.length ? evidence : [careerSkills[0]?.name].filter(Boolean),
    };
  });

  return {
    repoCount,
    activityScore,
    docQuality,
    techDiversity,
    projectQuality,
    deploymentEvidenceScore,
    portfolioScore,
    languages,
    evidencedSkills,
    projects,
  };
}

/**
 * Simulated resume parsing: keyword match against career skill names.
 */
function analyzeResume(resumeText, career) {
  const text = (resumeText || "").toLowerCase();
  const matched = [];
  const missing = [];
  career.skills.forEach(skill => {
    const hit = text.includes(skill.name.toLowerCase()) || text.includes(skill.id.toLowerCase());
    if (hit) matched.push(skill); else missing.push(skill);
  });
  const matchPct = career.skills.length ? clamp((matched.length / career.skills.length) * 100) : 0;

  // crude extraction of "achievements": lines with numbers/%
  const achievementLines = (resumeText || "")
    .split(/\n|\.(?=\s|$)/)
    .map(l => l.trim())
    .filter(l => /\d/.test(l) && l.length > 15 && l.length < 160)
    .slice(0, 3);

  return { matched, missing, matchPct, achievementLines };
}

/**
 * Simulated job description analysis: keyword extraction + comparison to twin.
 */
function analyzeJobDescription(jdText, career, skillState) {
  const text = (jdText || "").toLowerCase();
  const required = [];
  const preferred = [];
  career.skills.forEach(skill => {
    const mentioned = text.includes(skill.name.toLowerCase()) || text.includes(skill.id.toLowerCase());
    if (!mentioned) return;
    // crude heuristic: "preferred"/"nice to have"/"bonus" near the mention => preferred
    const idx = text.indexOf(skill.name.toLowerCase());
    const window = text.slice(Math.max(0, idx - 40), idx + 40);
    if (/preferred|nice to have|bonus|plus/.test(window)) preferred.push(skill);
    else required.push(skill);
  });
  if (required.length === 0 && preferred.length === 0) {
    // fallback: use full skill list as "required" so the page isn't empty
    required.push(...career.skills.slice(0, 5));
  }

  const evaluate = (skill) => {
    const conf = skillState[skill.id]?.score ?? 0;
    if (conf >= 70) return "strong";
    if (conf >= 40) return "partial";
    return "missing";
  };

  const all = [...required, ...preferred];
  const scored = all.map(s => ({ skill: s, status: evaluate(s) }));
  const strong = scored.filter(s => s.status === "strong");
  const partial = scored.filter(s => s.status === "partial");
  const missing = scored.filter(s => s.status === "missing");

  const matchPct = all.length
    ? clamp((strong.length * 1 + partial.length * 0.5) / all.length * 100)
    : 0;

  return { required, preferred, strong, partial, missing, matchPct };
}

/**
 * Career readiness = weighted rollup of the twin's sub-scores.
 */
function computeReadiness({ skillConfidenceAvg, githubScore, resumeMatch, projectEvidencePct, assessmentAvg, interviewAvg }) {
  const weights = {
    skillConfidenceAvg: 0.28,
    githubScore: 0.15,
    resumeMatch: 0.12,
    projectEvidencePct: 0.2,
    assessmentAvg: 0.15,
    interviewAvg: 0.1,
  };
  const vals = { skillConfidenceAvg, githubScore, resumeMatch, projectEvidencePct, assessmentAvg, interviewAvg };
  let total = 0;
  Object.keys(weights).forEach(k => { total += (vals[k] || 0) * weights[k]; });
  return clamp(total);
}

/**
 * Splits evidence into "Knowledge" (can you explain/demonstrate understanding —
 * assessment + interview) vs "Proof" (can you show it exists in the world —
 * resume + GitHub + deployment). Knowing something and proving it are different,
 * and the twin should be honest about which one is thin.
 */
function computeKnowledgeProof(evidence) {
  let knowledgeSum = 0, knowledgeCount = 0;
  if (evidence.assessmentScore !== null) { knowledgeSum += evidence.assessmentScore * 10; knowledgeCount++; }
  if (evidence.interviewScore !== null) { knowledgeSum += evidence.interviewScore * 10; knowledgeCount++; }
  const knowledge = knowledgeCount ? clamp(knowledgeSum / knowledgeCount) : 0;

  const proof = (evidence.resumeMention ? 20 : 0) + (evidence.githubProject ? 35 : 0) + (evidence.deploymentEvidence ? 45 : 0);

  return { knowledge, proof: clamp(proof) };
}

/**
 * Explains a Career Readiness score as weighted point contributions from each
 * sub-score, so "78/100" is never a black box.
 */
function readinessBreakdown(subScores) {
  const weights = { skillConfidenceAvg: 0.28, githubScore: 0.15, resumeMatch: 0.12, projectEvidencePct: 0.2, assessmentAvg: 0.15, interviewAvg: 0.10 };
  const labels = { skillConfidenceAvg: "Skills", githubScore: "GitHub", resumeMatch: "Resume Match", projectEvidencePct: "Projects", assessmentAvg: "Assessment", interviewAvg: "Interview" };
  return Object.keys(weights).map(k => ({
    key: k,
    label: labels[k],
    weightPct: Math.round(weights[k] * 100),
    rawScore: Math.round(subScores[k] || 0),
    points: Math.round((subScores[k] || 0) * weights[k]),
  }));
}

/**
 * Generates the "Next Best Action" — picks the highest-leverage weak skill
 * (high weight in career graph, low confidence) and a project that proves it.
 */
function nextBestAction(career, skillState, projectTemplates) {
  const ranked = [...career.skills]
    .map(s => ({ skill: s, conf: skillState[s.id]?.score ?? 0 }))
    .sort((a, b) => (b.skill.weight - a.skill.weight * (b.conf / 100)) - (a.skill.weight - a.skill.weight * (a.conf / 100)));

  // simpler: weight * (1 - confidence/100), descending
  const target = [...career.skills]
    .map(s => ({ skill: s, conf: skillState[s.id]?.score ?? 0 }))
    .map(x => ({ ...x, leverage: x.skill.weight * (1 - x.conf / 100) }))
    .sort((a, b) => b.leverage - a.leverage)[0];

  if (!target) return null;

  const project = projectTemplates.find(p => p.skills.includes(target.skill.id)) || projectTemplates[0];

  return {
    skill: target.skill,
    confidence: target.conf,
    project,
    message: `${target.skill.name} is important for your target role, but your current evidence is ${target.conf < 40 ? "weak" : "moderate"}.`,
  };
}

// ---- Derived lookups ---------------------------------------------------------
const SKILL_CATS_BY_ID = {};      // skill id -> [category, ...]
SKILL_CATEGORIES.forEach(c => c.skills.forEach(id => {
  if (!SKILL_DEFS[id]) { console.warn("skillCatalog: unknown skill id", id, "in", c.id); return; }
  (SKILL_CATS_BY_ID[id] = SKILL_CATS_BY_ID[id] || []).push(c);
}));

function normSkill(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }

const SKILL_ID_BY_NAME = {};      // normalized name / alias -> canonical id (names win over aliases)
Object.values(SKILL_DEFS).forEach(d => { SKILL_ID_BY_NAME[normSkill(d.name)] = d.id; });
const _aliasOwners = {};
Object.values(SKILL_DEFS).forEach(d => d.aliases.forEach(a => { (_aliasOwners[normSkill(a)] = _aliasOwners[normSkill(a)] || []).push(d.id); }));
Object.keys(_aliasOwners).forEach(k => {   // only unambiguous aliases may resolve a name to an id (e.g. "SQL" stays a custom skill)
  if (_aliasOwners[k].length === 1 && !(k in SKILL_ID_BY_NAME)) SKILL_ID_BY_NAME[k] = _aliasOwners[k][0];
});
// Friendly shorthands for legacy saved profiles ("React", "Java"…) and typed text.
Object.assign(SKILL_ID_BY_NAME, { "react": "react", "aws": "aws", "golang": "go", "c++": "cpp", "node": "nodejs",
  "k8s": "kubernetes", "js": "javascript", "ts": "typescript" });

// Primary category = first category that lists the skill (used for the stored selection record).
function skillPrimaryCategory(id) { const c = SKILL_CATS_BY_ID[id]; return c ? c[0] : null; }

// name -> selection record {id,name,category}; unknown names become custom skills (kept, never dropped).
function selectionFromName(name) {
  const id = SKILL_ID_BY_NAME[normSkill(name)];
  if (id) { const d = SKILL_DEFS[id]; const c = skillPrimaryCategory(id);
    return { id, name: d.name, category: c ? c.id : "other" }; }
  return { id: "custom:" + normSkill(name), name: String(name).trim(), category: "other" };
}
function selectionFromId(id) { return selectionFromName(SKILL_DEFS[id] ? SKILL_DEFS[id].name : id); }

// Dedupe a list of names/records into unique selection records, preserving order.
function dedupeSelections(list) {
  const seen = {}; const out = [];
  (list || []).forEach(x => {
    const r = typeof x === "string" ? selectionFromName(x) : selectionFromName(x.name);
    if (!r.name || seen[r.id]) return; seen[r.id] = 1; out.push(r);
  });
  return out;
}

// Every name a selected skill should count as for evidence matching (display name + aliases), lowercased.
function claimedNameSet(names) {
  const set = {};
  (names || []).forEach(n => {
    set[normSkill(n)] = 1;
    const id = SKILL_ID_BY_NAME[normSkill(n)];
    if (id) { set[normSkill(SKILL_DEFS[id].name)] = 1; SKILL_DEFS[id].aliases.forEach(a => { set[normSkill(a)] = 1; }); }
  });
  return set;
}

// Search: returns { direct: [ids], related: [ids] }. direct = name matches; related = keyword matches only.
function searchSkills(query) {
  const q = normSkill(query);
  if (!q) return { direct: [], related: [] };
  const direct = [], related = [];
  Object.values(SKILL_DEFS).forEach(d => {
    const n = normSkill(d.name);
    let score = 0;
    if (n === q) score = 100;
    else if (n.startsWith(q)) score = 80;
    else if (n.split(/[\s\/\-\(\)\.]+/).some(w => w.startsWith(q))) score = 60;
    else if (n.includes(q)) score = 40;
    if (score) { direct.push({ id: d.id, score }); return; }
    const kw = (" " + d.keywords + " ").toLowerCase();
    const cats = (SKILL_CATS_BY_ID[d.id] || []).map(c => normSkill(c.name)).join(" ");
    if (kw.includes(" " + q) || cats.includes(q)) related.push({ id: d.id, score: kw.includes(" " + q + " ") ? 2 : 1 });
  });
  const byScore = (a, b) => b.score - a.score || SKILL_DEFS[a.id].name.localeCompare(SKILL_DEFS[b.id].name);
  return { direct: direct.sort(byScore).map(x => x.id), related: related.sort(byScore).map(x => x.id) };
}

//   cSkill(id, name, kind, purpose, deps, claims)
//     kind    : lang | fw | db | tool | cloud | cs      (grouping in the career details panel)
//     purpose : "what it is used for" — also powers auto-generated assessment questions
//     deps    : soft prerequisites. A career's graph only draws the edges whose prerequisite is
//               ALSO required by that career (so the same skill links differently per career).
//     claims  : ids from the onboarding skill picker (skillCatalog.js) that count as "I know this".
//               A picker id identical to this skill's id is claimed automatically.
// ============================================================================

  SKILL_LIB[id] = {

    claims: claims ? claims.split(",") : [],
  };
}

// ============================================================================
// CAREER ROLE DEFINITIONS (data only). Add a role = add one line.
//   R(id, name, category, description, coreSkills, optionalSkills, technologies, certifications,
//     relatedRoleIds, exampleProject, searchKeywords, popular?)
// Skill ids come from careerSkills.js; list core skills roughly in learning order.
// The 7 original roles keep their hand-tuned skill graphs (core is "" for them).
// ============================================================================
const ROLE_DEFS = [];
function R(id, name, cat, desc, core, opt, tech, certs, related, project, kw, popular) {
  ROLE_DEFS.push({
    id, name, cat, desc,
    core: core ? core.split(",") : [], opt: opt ? opt.split(",") : [],
    tech: tech ? tech.split(",") : [], certs: certs ? certs.split(";") : [],
    related: related ? related.split(",") : [], project: project || "", kw: kw || "", popular: !!popular,
  });
}

// ==== src/data/careerCatalog.js ====
// ============================================================================
// CAREER CATALOGUE — builds every career from careerSkills.js + careerRoles.js and exposes the
// search / recommendation / graph / readiness helpers the Target Career explorer uses.
//
// IMPORTANT: this file EXTENDS the existing global CAREERS array (mockData.js) in place:
//   • the 7 original careers keep their ids and hand-tuned skill graphs (so saved profiles,
//     assessments, projects and evidence keep working) and gain catalogue metadata;
//   • every other role is generated in the SAME shape ({id,name,icon,description,technologies,
//     skills:[{id,name,weight,deps}]}), so the Digital Twin, Roadmap, Assessments, Interview,
//     GitHub Analyzer, Resume Intelligence and Job Matcher work for all of them unchanged.
// ============================================================================

const ROLE_LEVELS = [
  { id: "entry",  label: "Entry level", years: "0–1 yrs", target: 60, desc: "Starting out — fundamentals and first real projects." },
  { id: "junior", label: "Junior",      years: "1–3 yrs", target: 70, desc: "Working independently on well-defined tasks." },
  { id: "mid",    label: "Mid level",   years: "3–5 yrs", target: 78, desc: "Owning features and systems end to end." },
  { id: "senior", label: "Senior",      years: "5+ yrs",  target: 85, desc: "Leading design, quality and other engineers." },
];
const LEVEL_BY_ID = {}; ROLE_LEVELS.forEach(l => { LEVEL_BY_ID[l.id] = l; });
// Default career level inferred from the experience chosen in onboarding Step 2.
function defaultCareerLevel(experience) {
  return { student: "entry", fresher: "entry", junior: "junior", mid: "mid" }[experience] || "entry";
}
function levelTarget(levelId) { return (LEVEL_BY_ID[levelId] || LEVEL_BY_ID.entry).target; }

const KIND_GROUPS = [
  { kind: "lang",  label: "Programming languages" },
  { kind: "fw",    label: "Frameworks & libraries" },
  { kind: "db",    label: "Databases" },
  { kind: "tool",  label: "Development tools" },
  { kind: "cloud", label: "Cloud platforms" },
  { kind: "cs",    label: "CS fundamentals & concepts" },
];

const CATEGORY_BY_ID = {};
CAREER_CATEGORIES.forEach(c => { CATEGORY_BY_ID[c.id] = c; });

function libSkillObject(id, idx, coreIds) {
  const lib = SKILL_LIB[id];
  return {
    id, name: lib.name,
    weight: Math.max(0.6, +(1 - idx * 0.04).toFixed(2)),
    deps: lib.deps.filter(d => coreIds.includes(d) && d !== id),
  };
}

function fillTemplate(t, skills) {
  const n = (i) => (skills[i] ? skills[i].name : "core technologies");
  return t.replace("{a}", n(0)).replace("{b}", n(1)).replace("{c}", n(2));
}

const CAREER_BY_ID = {};
CAREERS.forEach(c => { CAREER_BY_ID[c.id] = c; });

ROLE_DEFS.forEach(def => {
  const cat = CATEGORY_BY_ID[def.cat];
  let career = CAREER_BY_ID[def.id];
  const isNew = !career;
  if (isNew) {
    const skills = def.core.map((id, i) => libSkillObject(id, i, def.core));
    career = { id: def.id, name: def.name, icon: cat.icon, description: def.desc, technologies: def.tech, skills };
    CAREERS.push(career);
    CAREER_BY_ID[career.id] = career;
  }
  const inCore = {}; career.skills.forEach(s => { inCore[s.id] = 1; });
  career.category = def.cat;
  career.optionalSkills = def.opt.filter(id => !inCore[id] && SKILL_LIB[id])
    .map(id => ({ id, name: SKILL_LIB[id].name }));
  career.certifications = def.certs;
  career.relatedIds = def.related;
  career.keywords = def.kw;
  career.popular = def.popular;
  career.responsibilities = [
    ...cat.resp.map(t => fillTemplate(t, career.skills)),
    `Keep current with the ${cat.name.toLowerCase()} ecosystem and share what you learn with the team`,
  ];
  career.exampleProjects = [
    def.project,
    `Build and deploy a ${def.tech[0] || career.skills[0].name} + ${def.tech[1] || career.skills[1]?.name || "cloud"} project that demonstrates ${career.skills[Math.min(2, career.skills.length - 1)].name}`,
    `Contribute a documented fix or feature to an open-source ${def.tech[0] || career.skills[0].name} project`,
  ].filter(Boolean);
});

// Core skills for ALL careers must reference only skills that exist in this career (graph integrity).
CAREERS.forEach(c => { const ids = c.skills.map(s => s.id); c.skills.forEach(s => { s.deps = s.deps.filter(d => ids.includes(d)); }); });

// One proof-of-skill project template per generated role (Projects page filters by careerId).
ROLE_DEFS.forEach(def => {
  const career = CAREER_BY_ID[def.id];
  if (!def.core.length || !def.project) return;   // originals already have curated templates
  PROJECT_TEMPLATES.push({
    id: "role-" + def.id, careerId: def.id, name: def.name.replace(/ \/.*$/, "") + " Capstone",
    skills: career.skills.slice(0, 3).map(s => s.id),
    description: def.project,
    deliverable: "A public GitHub repo with a README (problem, architecture, how to run) and a working demo or screenshots.",
  });
});

const FEATURED_CAREER_IDS = ["cloud-engineer", "devops-engineer", "software-developer", "fullstack-developer", "aiml-engineer", "cybersecurity-engineer", "data-analyst"];

// ----------------------------------------------------------------------------------------------
// Projects / resources / assessments — fall back to generated content for skills without curation
// ----------------------------------------------------------------------------------------------
function projectsForCareer(career) {
  return PROJECT_TEMPLATES.filter(p => (!p.careerId || p.careerId === career.id) && p.skills.some(sid => career.skills.some(s => s.id === sid)));
}
function projectForSkill(career, skillId) {
  const list = projectsForCareer(career);
  return list.find(p => p.skills.includes(skillId) && !p.careerId) || list.find(p => p.skills.includes(skillId));
}

function skillResources(id, name) {
  if (SKILL_RESOURCES[id]) return SKILL_RESOURCES[id];
  return [`Official ${name} documentation and getting-started guide`, `Build and publish a small project that uses ${name}`];
}

const KIND_LABELS = { lang: "A programming language", fw: "A framework or library", db: "A database technology", tool: "A development tool", cloud: "A cloud platform", cs: "A concept or discipline" };

// Deterministic generated questions so every skill in every career can be assessed.
function assessmentQuestionsFor(skillId) {
  if (ASSESSMENT_BANK[skillId]) return ASSESSMENT_BANK[skillId];
  const lib = SKILL_LIB[skillId];
  if (!lib) return [];
  const others = Object.values(SKILL_LIB).filter(s => s.id !== skillId && s.purpose !== lib.purpose);
  const pick = (n, seed, pool) => {
    const out = []; let i = 0;
    while (out.length < n && i < 200) { const c = pool[Math.floor(seededRandom(hashString(skillId) + seed + i * 31) * pool.length)]; if (c && !out.includes(c)) out.push(c); i++; }
    return out;
  };
  const place = (correct, wrong, seed) => {
    const idx = Math.floor(seededRandom(hashString(skillId) + seed) * (wrong.length + 1));
    const options = [...wrong]; options.splice(idx, 0, correct);
    return { options, answer: idx };
  };
  const qs = [];
  const wrongP = pick(3, 11, others).map(s => s.purpose);
  qs.push({ q: `What is ${lib.name} primarily used for?`, ...place(lib.purpose, wrongP, 5) });
  if (lib.deps.length) {
    const dep = SKILL_LIB[lib.deps[0]];
    const wrongD = pick(3, 23, Object.values(SKILL_LIB).filter(s => s.id !== skillId && !lib.deps.includes(s.id) && s.kind !== dep.kind)).map(s => s.name);
    qs.push({ q: `Which of these is a common prerequisite to learn before ${lib.name}?`, ...place(dep.name, wrongD, 9) });
  } else {
    const wrongK = Object.keys(KIND_LABELS).filter(k => k !== lib.kind).slice(0, 3).map(k => KIND_LABELS[k]);
    qs.push({ q: `Which description best fits ${lib.name}?`, ...place(KIND_LABELS[lib.kind], wrongK, 9) });
  }
  return qs;
}

// ----------------------------------------------------------------------------------------------
// Claimed skills (from onboarding Step 3) and role matching
// ----------------------------------------------------------------------------------------------
function claimContext(currentSkills) {
  const selIds = {};
  dedupeSelections(currentSkills || []).forEach(s => { selIds[s.id] = 1; });
  return { selIds, nameSet: claimedNameSet(currentSkills || []) };
}
function isSkillClaimed(skill, ctx) {
  if (ctx.nameSet[normSkill(skill.name)]) return true;
  if (ctx.selIds[skill.id]) return true;
  const lib = SKILL_LIB[skill.id];
  return !!lib && lib.claims.some(c => ctx.selIds[c]);
}
// Weighted share of a career's core skills the person claims (0–100). This is a *claim* match
// used for discovery/recommendation only — readiness itself is evidence-based (see app.js).
function roleMatch(career, ctx) {
  let total = 0, have = 0;
  career.skills.forEach(s => { total += s.weight; if (isSkillClaimed(s, ctx)) have += s.weight; });
  return total ? Math.round((have / total) * 100) : 0;
}
function recommendCareers(ctx, n = 6, excludeIds = []) {
  const any = Object.keys(ctx.selIds).length > 0;
  const ranked = CAREERS.filter(c => !excludeIds.includes(c.id))
    .map(c => ({ c, m: roleMatch(c, ctx) }))
    .sort((a, b) => (b.m - a.m) || ((b.c.popular ? 1 : 0) - (a.c.popular ? 1 : 0)) || a.c.name.localeCompare(b.c.name));
  return (any ? ranked.filter(r => r.m > 0) : ranked.filter(r => r.c.popular)).slice(0, n).map(r => ({ career: r.c, match: r.m }));
}

// Evidence-based status of one skill: known / partial / improve / missing.
function skillStatus(score) {
  if (score >= 70) return { id: "known", label: "Strong", tone: "good" };
  if (score >= 40) return { id: "partial", label: "Partial", tone: "warn" };
  if (score > 0) return { id: "improve", label: "Needs evidence", tone: "cyan" };
  return { id: "missing", label: "Missing", tone: "bad" };
}

// ----------------------------------------------------------------------------------------------
// Search & filters
// ----------------------------------------------------------------------------------------------
function tokenize(q) { return normSkill(q).split(/[\s,]+/).filter(Boolean); }
function words(text) { return normSkill(text).split(/[^a-z0-9+#]+/).filter(Boolean); }
// whole-word match (so "java" does not match "JavaScript", "sql" does not match "NoSQL")
function wordMatch(text, tok) {
  return words(text).some(w => w === tok || (tok.length >= 5 && w.startsWith(tok)));
}
// looser match for titles/keywords: substring for longer words, word-prefix for short ones
function looseMatch(text, tok) {
  const t = normSkill(text);
  if (tok.length <= 3) return words(t).some(w => w.startsWith(tok));
  return t.includes(tok);
}

const SEARCH_INDEX = {};
CAREERS.forEach(c => {
  const cat = CATEGORY_BY_ID[c.category];
  SEARCH_INDEX[c.id] = {
    name: c.name, kw: c.keywords || "", cat: cat ? cat.name : "",
    core: c.skills.map(s => s.name).concat(c.skills.map(s => s.id)),
    tech: c.technologies || [],
    opt: (c.optionalSkills || []).map(s => s.name),
    desc: c.description,
  };
});

function scoreCareer(c, tokens) {
  const ix = SEARCH_INDEX[c.id]; let total = 0;
  for (const tok of tokens) {
    let s = 0;
    const name = normSkill(ix.name);
    if (name === tok) s = 120;
    else if (words(name).includes(tok)) s = 100;
    else if (looseMatch(name, tok)) s = 80;
    if (wordMatch(ix.kw, tok)) s = Math.max(s, 60);
    if (ix.core.some(x => wordMatch(x, tok))) s = Math.max(s, 50);
    if (ix.tech.some(x => wordMatch(x, tok))) s = Math.max(s, 45);
    if (looseMatch(ix.cat, tok)) s = Math.max(s, 35);
    if (ix.opt.some(x => wordMatch(x, tok))) s = Math.max(s, 25);
    if (tok.length > 3 && looseMatch(ix.desc, tok)) s = Math.max(s, 10);
    if (!s) return 0;           // every word must match somewhere
    total += s;
  }
  return total;
}

function searchCareers(query, opts = {}) {
  const { category, ids } = opts;
  let list = CAREERS;
  if (ids) list = list.filter(c => ids.includes(c.id));
  if (category && category !== "all") list = list.filter(c => c.category === category);
  const tokens = tokenize(query);
  if (!tokens.length) return list.map(c => ({ career: c, score: 0 }));
  return list.map(c => ({ career: c, score: scoreCareer(c, tokens) })).filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score || ((b.career.popular ? 1 : 0) - (a.career.popular ? 1 : 0)) || a.career.name.localeCompare(b.career.name));
}

// ----------------------------------------------------------------------------------------------
// Dependency graph (generated from the career's own skill list, never hard-coded)
// ----------------------------------------------------------------------------------------------
function careerGraph(career) {
  const byId = {}; career.skills.forEach(s => { byId[s.id] = s; });
  const depth = {}; const visiting = {};
  const d = (id) => {
    if (depth[id] !== undefined) return depth[id];
    if (visiting[id]) return 0;
    visiting[id] = true;
    const s = byId[id]; const v = s.deps.filter(x => byId[x]).length ? Math.max(...s.deps.filter(x => byId[x]).map(d)) + 1 : 0;
    visiting[id] = false; depth[id] = v; return v;
  };
  career.skills.forEach(s => d(s.id));
  const columns = [];
  career.skills.forEach(s => { (columns[depth[s.id]] = columns[depth[s.id]] || []).push(s); });
  const edges = [];
  career.skills.forEach(s => s.deps.forEach(dep => { if (byId[dep]) edges.push({ from: dep, to: s.id }); }));
  const order = [...career.skills].sort((a, b) => depth[a.id] - depth[b.id] || b.weight - a.weight);
  return { depth, columns: columns.filter(Boolean), edges, order };
}

function careerSkillGroups(career) {
  const core = career.skills.map(s => ({ ...s, core: true }));
  const opt = (career.optionalSkills || []).map(s => ({ ...s, core: false }));
  return KIND_GROUPS.map(g => ({
    label: g.label,
    items: [...core, ...opt].filter(s => (SKILL_LIB[s.id] ? SKILL_LIB[s.id].kind : "cs") === g.kind),
  })).filter(g => g.items.length);
}

// ==== src/data/assessmentBank.js ====
// ============================================================================
// ASSESSMENT QUESTION BANK — hand-written, answer-checked technical questions.
// Shape: QBANK[skillId] = { basic: [...], intermediate: [...], advanced: [...] }
// Every skill NOT listed here still gets Basic/Intermediate/Advanced assessments from the generated
// pools in assessmentEngine.js (derived from the skill library and role graphs).
// Question types: mcq | multi | tf | output (predict output) | debug (find the bug) | scenario.
// ============================================================================
const mc  = (topic, q, options, answer, explain, code) => ({ type: "mcq", topic, q, options, answer, explain, code });
const ms  = (topic, q, options, answer, explain, code) => ({ type: "multi", topic, q, options, answer, explain, code });
const tf  = (topic, q, truth, explain, code) => ({ type: "tf", topic, q, options: ["True", "False"], answer: truth ? 0 : 1, explain, code });
const out = (topic, q, code, options, answer, explain) => ({ type: "output", topic, q, options, answer, explain, code });
const dbg = (topic, q, code, options, answer, explain) => ({ type: "debug", topic, q, options, answer, explain, code });
const sc  = (topic, q, options, answer, explain) => ({ type: "scenario", topic, q, options, answer, explain });

      tf("Equality", "`0 == '0'` is true in JavaScript.", true, "Loose equality coerces the string to a number."),
      out("Arrays", "What is logged?", "console.log([1, 2, 3].map(n => n * 2))", ["[1, 2, 3]", "[2, 4, 6]", "6", "undefined"], 1, "map returns a new array with each element doubled."),

// ==== src/data/assessmentEngine.js ====
// ============================================================================
// ASSESSMENT ENGINE — isomorphic (runs in the browser bundle AND in the Node backend, which loads
// the data files with `new Function`). Pure functions, no DOM, no React.
//   questionPool(skillId, level)           every candidate question (curated + generated)
//   buildAssessment(skillId, level, cfg, o) a seeded, non-repeating question set (WITH answers)
//   publicQuestions(questions)             same set with answers/explanations stripped
//   gradeAssessment(questions, answers, o) score, topic analysis, per-question review
//   skillComposite(entries)                0-100 evidence score for one skill from its history
//   recommendNext(career, history, state)  what to assess next and why
// ============================================================================

const ASSESSMENT_LEVELS = [
  { id: "basic",        label: "Basic",        short: "Fundamentals",  desc: "Fundamentals, terminology, syntax and core concepts.",                              questions: 10, minutes: 15, passPct: 60 },
  { id: "intermediate", label: "Intermediate", short: "Practical",     desc: "Practical implementation, debugging, code analysis and real-world scenarios.",       questions: 15, minutes: 25, passPct: 65 },
  { id: "advanced",     label: "Advanced",     short: "Production",    desc: "Complex scenarios, architecture, performance, security and production troubleshooting.", questions: 20, minutes: 40, passPct: 70 },
];
const ASSESSMENT_LEVEL_IDS = ASSESSMENT_LEVELS.map(l => l.id);
const ASSESSMENT_FORMATS = [
  { id: "mcq", label: "Single choice" }, { id: "multi", label: "Multiple answer" }, { id: "tf", label: "True / False" },
  { id: "output", label: "Code output" }, { id: "debug", label: "Debugging" }, { id: "scenario", label: "Scenario / problem solving" },
];
const ASSESSMENT_FORMAT_IDS = ASSESSMENT_FORMATS.map(f => f.id);
// Weight of each level's best score in the per-skill evidence score. Unattempted levels count as 0,
// so Basic-only results can never be read as verified expert proficiency.
const LEVEL_WEIGHTS = { basic: 0.40, intermediate: 0.35, advanced: 0.25 };

function defaultAssessmentConfig() {
  const levels = {};
  ASSESSMENT_LEVELS.forEach(l => { levels[l.id] = { enabled: true, questions: l.questions, minutes: l.minutes, passPct: l.passPct, formats: ASSESSMENT_FORMAT_IDS.slice() }; });
  return { levels };
}
// Clamp / repair any (possibly hostile or partial) config object into a safe full config.
function normalizeAssessmentConfig(raw) {
  const base = defaultAssessmentConfig();
  const src = raw && typeof raw === "object" && raw.levels && typeof raw.levels === "object" ? raw.levels : {};
  const num = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
  ASSESSMENT_LEVEL_IDS.forEach(id => {
    const s = src[id] || {}, d = base.levels[id];
    const formats = Array.isArray(s.formats) ? s.formats.filter(f => ASSESSMENT_FORMAT_IDS.includes(f)) : d.formats;
    base.levels[id] = {
      enabled: s.enabled === false ? false : true,
      questions: num(s.questions, 1, 50, d.questions),
      minutes: num(s.minutes, 1, 180, d.minutes),
      passPct: num(s.passPct, 1, 100, d.passPct),
      formats: formats.length ? formats : d.formats,
    };
  });
  return base;
}

// ---------------------------------------------------------------- generated question pools
const KIND_NOUN = { lang: "a programming language", fw: "a framework or library", db: "a database technology", tool: "a development or operations tool", cloud: "a cloud platform", cs: "a concept or engineering discipline" };

function _pick(pool, n, seedStr) {
  const out = []; const arr = pool.slice();
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(seededRandom(hashString(seedStr) + i * 7919) * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  for (let i = 0; i < arr.length && out.length < n; i++) if (!out.includes(arr[i])) out.push(arr[i]);
  return out;
}
function _careersWith(skillId) { return CAREERS.filter(c => c.skills.some(s => s.id === skillId)); }
function _chain(skillId, limit = 3) {           // transitive prerequisite chain, deepest first
  const out = []; let cur = SKILL_LIB[skillId];
  while (cur && cur.deps.length && out.length < limit) { const d = SKILL_LIB[cur.deps[0]]; if (!d || out.includes(d.id) || d.id === skillId) break; out.push(d.id); cur = d; }
  return out.reverse();
}

// Each family returns { type, topic, q, options (correct first, shuffled later), answer (index or [indexes]), explain }
function _generated(skillId, level) {
  const s = SKILL_LIB[skillId]; if (!s) return [];
  const all = Object.values(SKILL_LIB);
  const diffPurpose = all.filter(o => o.id !== skillId && o.purpose !== s.purpose);
  const sameKind = diffPurpose.filter(o => o.kind === s.kind);
  const otherKind = all.filter(o => o.kind !== s.kind);
  const out = []; const add = (key, q) => out.push({ ...q, gkey: key });
  const kindNouns = Object.keys(KIND_NOUN).filter(k => k !== s.kind).map(k => KIND_NOUN[k]);
  const careers = _careersWith(skillId);

  if (level === "basic") {
    add("purpose", { type: "mcq", topic: "Core concepts", q: `What is ${s.name} primarily used for?`, options: [s.purpose, ..._pick(diffPurpose, 3, skillId + "bp").map(o => o.purpose)], answer: 0, explain: `${s.name} is used for ${s.purpose}.` });
    add("kind", { type: "mcq", topic: "Terminology", q: `Which description best fits ${s.name}?`, options: [KIND_NOUN[s.kind], ..._pick(kindNouns, 3, skillId + "bk")], answer: 0, explain: `${s.name} is ${KIND_NOUN[s.kind]}.` });
    add("tf-true", { type: "tf", topic: "Core concepts", q: `${s.name} is commonly used for ${s.purpose}.`, options: ["True", "False"], answer: 0, explain: `Correct — ${s.name} is used for ${s.purpose}.` });
    const wp = _pick(diffPurpose, 1, skillId + "bf")[0];
    if (wp) add("tf-false", { type: "tf", topic: "Core concepts", q: `${s.name} is primarily used for ${wp.purpose}.`, options: ["True", "False"], answer: 1, explain: `False — ${s.name} is used for ${s.purpose}; ${wp.purpose} describes ${wp.name}.` });
    add("which-kind", { type: "mcq", topic: "Terminology", q: `Which of these is ${KIND_NOUN[s.kind]}?`, options: [s.name, ..._pick(otherKind, 3, skillId + "bw").map(o => o.name)], answer: 0, explain: `${s.name} is ${KIND_NOUN[s.kind]}.` });
    if (s.deps.length && SKILL_LIB[s.deps[0]]) {
      const d = SKILL_LIB[s.deps[0]];
      add("prereq", { type: "mcq", topic: "Learning path", q: `Which of these is a common prerequisite to learn before ${s.name}?`, options: [d.name, ..._pick(all.filter(o => o.id !== skillId && !s.deps.includes(o.id) && o.kind !== d.kind), 3, skillId + "bd").map(o => o.name)], answer: 0, explain: `${d.name} is a foundation for ${s.name}.` });
    }
  }

  if (level === "intermediate") {
    add("scenario-purpose", { type: "scenario", topic: "Applying skills", q: `Your team needs a technology for ${s.purpose}. Which is the best fit?`, options: [s.name, ..._pick(sameKind.length >= 3 ? sameKind : diffPurpose, 3, skillId + "is").map(o => o.name)], answer: 0, explain: `${s.name} is the one used for ${s.purpose}.` });
    const peer = _pick(sameKind, 1, skillId + "im")[0];
    if (peer) add("multi-kind", { type: "multi", topic: "Terminology", q: `Select ALL that are ${KIND_NOUN[s.kind]}:`, options: [s.name, peer.name, ..._pick(otherKind, 2, skillId + "imo").map(o => o.name)], answer: [0, 1], explain: `${s.name} and ${peer.name} are both ${KIND_NOUN[s.kind]}.` });
    if (s.deps.length && SKILL_LIB[s.deps[0]]) {
      const d = SKILL_LIB[s.deps[0]];
      add("tf-prereq", { type: "tf", topic: "Learning path", q: `${d.name} is a sensible foundation to build before ${s.name}.`, options: ["True", "False"], answer: 0, explain: `${d.name} underpins ${s.name}.` });
      add("tf-reverse", { type: "tf", topic: "Learning path", q: `You should master ${s.name} before learning ${d.name}.`, options: ["True", "False"], answer: 1, explain: `The usual order is ${d.name} first, then ${s.name}.` });
    }
    _pick(careers, 4, skillId + "ic").forEach(c => {
      const others = CAREERS.filter(o => !o.skills.some(x => x.id === skillId));
      add("career-has-" + c.id, { type: "mcq", topic: "Career relevance", q: `Which role lists ${s.name} among its core skills?`, options: [c.name, ..._pick(others, 3, skillId + c.id + "ico").map(o => o.name)], answer: 0, explain: `${s.name} is a core skill for ${c.name}.` });
      const sibs = c.skills.filter(x => x.id !== skillId && SKILL_LIB[x.id] && SKILL_LIB[x.id].purpose !== s.purpose);
      if (sibs.length >= 3) add("career-need-" + c.id, { type: "scenario", topic: "Applying skills", q: `As a ${c.name}, you must handle ${s.purpose}. Which skill from your role's stack do you reach for?`, options: [s.name, ..._pick(sibs, 3, skillId + c.id + "icn").map(o => o.name)], answer: 0, explain: `${s.name} covers ${s.purpose}.` });
    });
  }

  if (level === "advanced") {
    const chain = _chain(skillId);
    if (chain.length) {
      const names = chain.map(id => SKILL_LIB[id].name); const good = [...names, s.name].join(" → ");
      const rev = [s.name, ...names.slice().reverse()].join(" → ");
      const swap = names.length > 1 ? [names[1], names[0], s.name].join(" → ") : [s.name, names[0]].join(" → ");
      const pad = [_pick(otherKind, 1, skillId + "a1")[0].name, ...names, s.name].join(" → ");
      add("path", { type: "mcq", topic: "Learning path", q: `Which learning sequence best respects the prerequisites of ${s.name}?`, options: [good, rev, swap === rev ? pad : swap, [s.name, ...names].join(" → ")], answer: 0, explain: `Foundations come first: ${good}.` });
    }
    const rival = _pick(sameKind, 2, skillId + "ar");
    rival.forEach((r, i) => add("tradeoff-" + i, { type: "scenario", topic: "Trade-offs", q: `Your project requires ${s.purpose}. A teammate proposes ${r.name}, which is mainly used for ${r.purpose}. What is the strongest decision?`, options: [`Choose ${s.name} — it targets ${s.purpose}`, `Choose ${r.name} — it is the better fit`, `Use both for every task`, `Postpone the decision indefinitely`], answer: 0, explain: `${s.name} is aimed at ${s.purpose}, whereas ${r.name} is aimed at ${r.purpose}.` }));
    _pick(careers, 4, skillId + "ac").forEach(c => {
      const sk = c.skills.find(x => x.id === skillId);
      const deps = (sk.deps || []).filter(d => SKILL_LIB[d]);
      const rest = c.skills.filter(x => x.id !== skillId && !deps.includes(x.id) && !(x.deps || []).includes(skillId));
      if (deps.length && rest.length >= 2) {
        const pick = deps.slice(0, 2);
        add("deps-" + c.id, { type: "multi", topic: "Career architecture", q: `In the ${c.name} skill graph, which skills should be in place BEFORE ${s.name}? Select all that apply.`, options: [...pick.map(d => SKILL_LIB[d].name), ..._pick(rest, 4 - pick.length, skillId + c.id + "ad").map(o => o.name)], answer: pick.map((d, i) => i), explain: `${s.name} builds on ${pick.map(d => SKILL_LIB[d].name).join(" and ")} for a ${c.name}.` });
      }
      const dependants = c.skills.filter(x => (x.deps || []).includes(skillId) && SKILL_LIB[x.id]);
      if (dependants.length && rest.length >= 3) {
        const dd = dependants[0];
        add("unlocks-" + c.id, { type: "mcq", topic: "Career architecture", q: `For a ${c.name}, which skill is unlocked by (builds directly on) ${s.name}?`, options: [dd.name, ..._pick(rest, 3, skillId + c.id + "au").map(o => o.name)], answer: 0, explain: `${dd.name} depends on ${s.name} in the ${c.name} skill graph.` });
      }

function defaultInterviewConfig(careerId, category, level) {

function estimateLevel(ctx) {

    const gapScore = inCareer.length ? gaps.reduce((s, g) => s + g.w * (1 - g.conf / 100), 0) / (inCareer.reduce((s, x) => s + cw[x].weight, 0) || 1) : 0;

    if (gaps.length) reasons.push(`Closes skill gaps: ${gaps.slice(0, 3).map(g => `${g.name} (${Math.round(g.conf)}%)`).join(", ")}`);
    if (known.length) reasons.push(`Builds on what you already know: ${known.slice(0, 3).map(pjSkillName).join(", ")}`);
    reasons.push(`${p.levelFor === 1 ? "" : ""}${li === tIdx ? `Matches your ${difficulty === "auto" ? "estimated" : "selected"} level (${PJ_LEVEL_LABEL[target]})` : `One step ${li > tIdx ? "above" : "below"} your ${PJ_LEVEL_LABEL[target]} level`}`);
    if (ctx.githubData && p.skills.some(s => cw[s] && !gh.has(s))) reasons.push(`GitHub analysis shows no evidence yet for ${p.skills.filter(s => cw[s] && !gh.has(s)).slice(0, 2).map(pjSkillName).join(", ")}`);
    if (resumeGap.length) reasons.push(`Your resume lists ${resumeGap.slice(0, 2).map(pjSkillName).join(", ")} but there is no project proof`);

}

    return nextT ? reply("next-step", `Next: ${nextT.title}`, { paragraphs: [nextT.detail], questions: [nextT.hint || "What is the smallest version of this you can finish in 30 minutes?"], bullets: ["Make a small commit when this works"] }) : reply("next-step", "All tasks are ticked", { paragraphs: ["Review the testing and deployment checklists, then submit your evidence for verification."] });
  }
  if (/should i|which (is )?better|is it ok|is it fine|trade.?off|versus| vs |decision|review my/.test(m)) return reply("decision", "Reviewing a decision", { paragraphs: ["I won't just pick for you — a defensible decision is what reviewers look for. Test it against these questions:"],
    bullets: ["What requirement does this choice serve? (cite it)", "What are two alternatives and what does each cost?", "What happens when it fails or when load doubles?", "How hard is it to reverse later?", "Does it match the skills this project must demonstrate?"], questions: ["Write your choice, the alternative, and the deciding reason in three lines — I'll challenge it."] });
  if (/improve|better|feedback|polish|weak/.test(m)) {
    const ev = ctx.entry?.evaluation;
    return reply("improve", "How to improve it", ev ? { paragraphs: [`Based on your latest evaluation (overall ${ev.overall}):`], bullets: ev.suggestions.length ? ev.suggestions : ["Evaluation found no major gaps — document your trade-offs."], questions: ["Which single suggestion gives the biggest credibility gain for the least work?"] }
      : { paragraphs: ["Submit your repository for evaluation to get specific, evidence-based suggestions. Meanwhile:"], bullets: ["Add tests for failure paths", "Add CI", "Record measurements, not claims", "Explain one design trade-off in the README"] });
  }
  const sk = pjFindSkill(msg, p);
  if (sk && /explain|what is|what's|how|why|learn|teach|use|work/.test(m)) {
    const s = SKILL_LIB[sk];
    return reply("technology", `Understanding ${s.name}`, { paragraphs: [`${s.purpose || s.name + " is used in this project."}`, p.skills.includes(sk) ? `Why it is in ${p.name}: it is one of the required skills, so verification looks for real use of it in your code or configuration.` : "It is not required by this project, but it may still help."],
      bullets: [s.deps?.length ? `Build on first: ${s.deps.map(pjSkillName).join(", ")}` : "No hard prerequisites", `Micro-exercise: create a tiny, separate example that uses only ${s.name}, then integrate it into the project.`], resources: skillResources(sk, s.name), questions: [`Where exactly in ${p.name} will ${s.name} be used, and what would break without it?`] });
  }
  return reply("help", "How I can help", { paragraphs: ["I'm a rule-based mentor: I explain, ask questions and point to docs — I don't write your project."], bullets: ["Requirements and scope", "Architecture and components", "A technology you're unsure about (e.g. “explain " + pjSkillName(p.skills[0]) + "”)", "Debugging (paste the error)", "Explaining or reviewing code you paste", "README and final-report structure", "“What should I do next?”"] });
}

// ============================================================================
// API client for the optional Node/Express + PostgreSQL backend.
//  • Served by the backend (http://localhost:3000)  → API.available becomes true → real accounts + DB.
//  • Opened as a plain file (file://) or backend down → API.available stays false → the original
//    localStorage demo mode keeps working exactly as before.
// ============================================================================
const API = {
  available: false,
  token: (() => { try { return localStorage.getItem("skillpilot:token"); } catch (e) { return null; } })(),

  setToken(t) {
    API.token = t;
    try { t ? localStorage.setItem("skillpilot:token", t) : localStorage.removeItem("skillpilot:token"); } catch (e) { /* ignore */ }
  },

  async detect() {
    if (typeof location === "undefined" || !/^https?:$/.test(location.protocol)) return false;
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 2500);
      const r = await fetch("/api/health", { signal: ctl.signal }); clearTimeout(timer);
      const j = await r.json();
      API.available = !!(r.ok && j && j.ok);
    } catch (e) { API.available = false; }
    return API.available;
  },

  async request(method, url, body) {
    const r = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json", ...(API.token ? { Authorization: "Bearer " + API.token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(data.error || "Request failed."); err.status = r.status; throw err; }
    return data;
  },

  login: (email, password) => API.request("POST", "/api/auth/login", { email, password }),
  signup: (name, email, password) => API.request("POST", "/api/auth/signup", { name, email, password }),
  me: () => API.request("GET", "/api/auth/me"),
  loadState: () => API.request("GET", "/api/state"),
  saveState: (state) => API.request("PUT", "/api/state", state),
};

// Fades content in once it scrolls into view. Falls back to always-visible if
// IntersectionObserver is unavailable, and respects prefers-reduced-motion.
function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || typeof IntersectionObserver === "undefined") { setVisible(true); return; }
    const node = ref.current;
    if (!node) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { setVisible(true); obs.unobserve(e.target); } });
    }, { threshold: 0.15 });
    obs.observe(node);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} className={className} style={{ opacity: visible ? 1 : 0, transform: visible ? "none" : "translateY(14px)", transition: `opacity 0.6s ease ${delay}ms, transform 0.6s cubic-bezier(.2,.7,.2,1) ${delay}ms` }}>
      {children}
    </div>
  );
}

// Animates a number from 0 to `target` over `durationMs`, driven by requestAnimationFrame
// (guaranteed to terminate — no setInterval loop to forget to clear). `active` gates when
// the count-up starts; set it false to hold at 0.
function useCountUp(target, durationMs = 1200, active = true) {
  const [value, setValue] = useState(0);
  const frameRef = useRef(null);

  useEffect(() => {
    if (!active) { setValue(0); return; }
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { setValue(target); return; }
    const start = performance.now();
    const tick = (now) => {
      const elapsed = now - start;
      const pct = Math.min(1, elapsed / durationMs);
      const eased = 1 - Math.pow(1 - pct, 3);
      setValue(Math.round(target * eased));
      if (pct < 1) frameRef.current = requestAnimationFrame(tick);
    };
    frameRef.current = requestAnimationFrame(tick);
    return () => { if (frameRef.current) cancelAnimationFrame(frameRef.current); };
  }, [target, durationMs, active]);

  return value;
}

function prefersReducedMotion() {
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

// Shows a real score, or an honest "not yet" state instead of a bare, broken-looking 0/100.

function ParticleField({ count = 22 }) {
  const particles = useMemo(() => {
    return Array.from({ length: count }).map((_, i) => {
      const seed = hashString("particle-" + i);
      const top = seededRandom(seed) * 100;
      const left = seededRandom(seed + 1) * 100;
      const size = 1 + seededRandom(seed + 2) * 2.2;
      const duration = 10 + seededRandom(seed + 3) * 14;
      const delay = seededRandom(seed + 4) * -20;
      const opacity = 0.2 + seededRandom(seed + 5) * 0.35;
      const cyan = seededRandom(seed + 6) > 0.5;
      return { id: i, top, left, size, duration, delay, opacity, cyan };
    });
  }, [count]);

  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      {particles.map(p => (
        <span key={p.id} className="absolute rounded-full particle-float"
          style={{
            top: `${p.top}%`, left: `${p.left}%`, width: `${p.size}px`, height: `${p.size}px`,
            background: p.cyan ? "#06B6D4" : "#818CF8", opacity: p.opacity,
            animationDuration: `${p.duration}s`, animationDelay: `${p.delay}s`,
          }} />
      ))}
    </div>
  );
}

// Phase timings (ms), tuned to land the whole sequence at ~5.5s total.
const T_NODES_START = 0;
const T_NODE_STEP = 260;
const T_CONNECT = 1100;
const T_STATUS_START = 1400;
const T_STATUS_STEP = 420;
const T_TWIN_REVEAL = 1400 + STATUS_MESSAGES.length * 420 + 200; // ~3700
const T_SKILLS_REVEAL = T_TWIN_REVEAL + 900; // ~4600
const T_GAP_CALLOUT = T_SKILLS_REVEAL + 900; // ~5500
const T_DONE = T_GAP_CALLOUT + 400;

function useHeroSequence() {
  // phase: 0 idle/nodes, 1 connecting, 2 analyzing (status cycling), 3 twin revealed,
  // 4 skills revealed, 5 gap callout, 6 done (final resting state)
  const [phase, setPhase] = useState(0);
  const [nodesShown, setNodesShown] = useState(0);
  const [statusIndex, setStatusIndex] = useState(0);
  const timers = useRef([]);

  const clearAll = () => { timers.current.forEach(clearTimeout); timers.current = []; };

  const skipToEnd = () => {
    clearAll();
    setNodesShown(EVIDENCE_NODES.length);
    setStatusIndex(STATUS_MESSAGES.length - 1);
    setPhase(6);
  };

  useEffect(() => {
    if (prefersReducedMotion()) { skipToEnd(); return () => clearAll(); }

    EVIDENCE_NODES.forEach((_, i) => {
      timers.current.push(setTimeout(() => setNodesShown(i + 1), T_NODES_START + i * T_NODE_STEP));
    });
    timers.current.push(setTimeout(() => setPhase(1), T_CONNECT));
    timers.current.push(setTimeout(() => setPhase(2), T_STATUS_START));
    STATUS_MESSAGES.forEach((_, i) => {
      timers.current.push(setTimeout(() => setStatusIndex(i), T_STATUS_START + i * T_STATUS_STEP));
    });
    timers.current.push(setTimeout(() => setPhase(3), T_TWIN_REVEAL));
    timers.current.push(setTimeout(() => setPhase(4), T_SKILLS_REVEAL));
    timers.current.push(setTimeout(() => setPhase(5), T_GAP_CALLOUT));
    timers.current.push(setTimeout(() => setPhase(6), T_DONE));

    return clearAll;
  }, []);

  return { phase, nodesShown, statusIndex, skipToEnd };
}

function FieldError({ msg }) {
  if (!msg) return null;
  return <p className="text-xs text-bad mt-1.5 flex items-center gap-1"><Icon name="alert-triangle" size={11} />{msg}</p>;
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function Login({ onLogin, onGoSignup, onBackHome }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [rememberMe, setRememberMe] = useState(true);
  const [errors, setErrors] = useState({});
  const [forgotMsg, setForgotMsg] = useState(false);
  const [submitting, setSubmitting] = useState(false);

  const validate = () => {
    const e = {};
    if (!email.trim()) e.email = "Enter your email address.";
    else if (!EMAIL_RE.test(email.trim())) e.email = "That doesn't look like a valid email.";
    if (!password) e.password = "Enter your password.";
    else if (password.length < 6) e.password = "Password must be at least 6 characters.";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    setSubmitting(true);
    const err = await onLogin({ email: email.trim(), password });
    setSubmitting(false);
    if (err) setErrors({ form: err });
  };

  return (
    <AuthShell>
      <h1 className="font-display text-2xl font-semibold mb-1.5">Welcome back</h1>
      <p className="text-mute text-sm mb-6">Log in to pick up where your Career Digital Twin left off.</p>

      <form onSubmit={submit} noValidate>
        <Field label="Email">
          <input type="email" className={inputCls} value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" />
          <FieldError msg={errors.email} />
        </Field>
        <Field label="Password">
          <div className="relative">
            <input type={showPassword ? "text" : "password"} className={inputCls + " pr-11"} value={password}
              onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" />
            <button type="button" onClick={() => setShowPassword(s => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 text-mute hover:text-ink">
              <Icon name={showPassword ? "eye-off" : "eye"} size={15} />
            </button>
          </div>
          <FieldError msg={errors.password} />
        </Field>

        <div className="flex items-center justify-between mb-6 -mt-1">
          <label className="flex items-center gap-2 text-xs text-mute cursor-pointer">
            <input type="checkbox" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} className="accent-indigo w-3.5 h-3.5" />
            Remember me
          </label>
          <button type="button" onClick={() => setForgotMsg(true)} className="text-xs text-cyan hover:underline">Forgot password?</button>
        </div>
        {forgotMsg && (
          <div className="text-xs text-mute glass rounded-lg p-3 mb-5">{API.available ? "Password reset by email isn't set up yet — contact the site admin to reset your password." : "Password reset isn't wired up in this demo build — just log in with any email/password to continue."}</div>
        )}

        <FieldError msg={errors.form} />
        <Button type="submit" className="w-full mb-3 mt-2" size="lg" disabled={submitting}>
          {submitting ? <><Spinner size={15} /> Logging in…</> : "Log In"}
        </Button>
        <Button type="button" variant="secondary" className="w-full mb-6" size="lg" onClick={() => setErrors(e => ({ ...e, google: "Google sign-in isn't connected in this demo." }))}>
          Continue with Google
        </Button>
        <FieldError msg={errors.google} />
      </form>

      <p className="text-center text-sm text-mute">Don't have an account? <button onClick={onGoSignup} className="text-cyan hover:underline">Create one</button></p>
      <button onClick={onBackHome} className="w-full text-center text-xs text-mute hover:text-ink mt-6">← Back to home</button>
      <p className="text-center text-[11px] text-mute/70 mt-4">{API.available ? "Your account is stored securely in the SkillPilot database." : "Demo authentication — no real account is created or verified."}</p>
    </AuthShell>
  );
}

function Signup({ onSignup, onGoLogin, onBackHome }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [agree, setAgree] = useState(false);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);

  const validate = () => {
    const e = {};
    if (!name.trim()) e.name = "Enter your full name.";
    if (!email.trim()) e.email = "Enter your email address.";
    else if (!EMAIL_RE.test(email.trim())) e.email = "That doesn't look like a valid email.";
    if (!password) e.password = "Choose a password.";
    else if (password.length < 6) e.password = "Password must be at least 6 characters.";
    if (confirm !== password || !confirm) e.confirm = "Passwords don't match.";
    if (!agree) e.agree = "You need to accept the Terms & Privacy Policy to continue.";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    setSubmitting(true);
    const err = await onSignup({ name: name.trim(), email: email.trim(), password });
    setSubmitting(false);
    if (err) setErrors({ form: err });
  };

  return (
    <AuthShell>
      <h1 className="font-display text-2xl font-semibold mb-1.5">Create your account</h1>
      <p className="text-mute text-sm mb-6">Start building an evidence-based Career Digital Twin.</p>

      <form onSubmit={submit} noValidate>
        <Field label="Full name">
          <input className={inputCls} value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Chetan Kumar" autoComplete="name" />
          <FieldError msg={errors.name} />
        </Field>
        <Field label="Email">
          <input type="email" className={inputCls} value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" autoComplete="email" />
          <FieldError msg={errors.email} />
        </Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Password">
            <input type="password" className={inputCls} value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" autoComplete="new-password" />
            <FieldError msg={errors.password} />
          </Field>
          <Field label="Confirm password">
            <input type="password" className={inputCls} value={confirm} onChange={e => setConfirm(e.target.value)} placeholder="••••••••" autoComplete="new-password" />
            <FieldError msg={errors.confirm} />
          </Field>
        </div>

        <label className="flex items-start gap-2.5 text-xs text-mute mb-6 cursor-pointer">
          <input type="checkbox" checked={agree} onChange={e => setAgree(e.target.checked)} className="accent-indigo w-3.5 h-3.5 mt-0.5" />
          <span>I agree to the Terms of Service and Privacy Policy.</span>
        </label>
        <FieldError msg={errors.agree} />
        <FieldError msg={errors.form} />

        <Button type="submit" className="w-full mt-2" size="lg" disabled={submitting}>
          {submitting ? <><Spinner size={15} /> Creating account…</> : "Create Account"}
        </Button>
      </form>

      <p className="text-center text-sm text-mute mt-6">Already have an account? <button onClick={onGoLogin} className="text-cyan hover:underline">Log in</button></p>
      <button onClick={onBackHome} className="w-full text-center text-xs text-mute hover:text-ink mt-6">← Back to home</button>
      <p className="text-center text-[11px] text-mute/70 mt-4">{API.available ? "Your account is stored securely in the SkillPilot database." : "Demo authentication — no real account is created or verified."}</p>
    </AuthShell>
  );
}

// Categorized, searchable, multi-select technical skills picker.
// Props: value = array of skill display names (profile.currentSkills), onChange(names, selections)
// where selections = [{ id, name, category }] (unique ids). Driven entirely by data/skillCatalog.js.
function SkillPicker({ value, onChange }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(() => {
    const o = {}; SKILL_CATEGORIES.forEach(c => { if (c.defaultOpen) o[c.id] = true; }); return o;
  });

  const selections = useMemo(() => dedupeSelections(value), [value]);
  const selectedIds = useMemo(() => { const m = {}; selections.forEach(s => { m[s.id] = true; }); return m; }, [selections]);

  const commit = (list) => onChange(list.map(s => s.name), list);
  const toggleId = (id) => {
    if (selectedIds[id]) commit(selections.filter(s => s.id !== id));
    else commit([...selections, selectionFromId(id)]);
  };
  const addIds = (ids) => commit([...selections, ...ids.filter(id => !selectedIds[id]).map(selectionFromId)]);
  const removeIds = (ids) => { const drop = {}; ids.forEach(i => { drop[i] = 1; }); commit(selections.filter(s => !drop[s.id])); };
  const addCustom = (text) => {
    const name = text.trim(); if (!name) return;
    commit(dedupeSelections([...selections, name])); setQuery("");
  };

  const q = query.trim();
  const results = useMemo(() => searchSkills(q), [q]);
  const exact = q && SKILL_ID_BY_NAME[normSkill(q)];

  const renderChip = (id, showMeta) => {
    const d = SKILL_DEFS[id]; const on = !!selectedIds[id];
    const cats = (SKILL_CATS_BY_ID[id] || []).map(c => c.name);
    return (
      <button key={id} type="button" aria-pressed={on} onClick={() => toggleId(id)} data-skill-id={id}
        className={`skill-chip ${on ? "is-on" : "text-mute hover:text-ink"} inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm text-left`}>
        {on && <Icon name="check" size={13} className="text-cyan shrink-0" strokeWidth={2.5} />}
        <span>{d.name}</span>
        {showMeta && <span className="text-[10px] uppercase tracking-wide text-mute/80 font-mono ml-0.5">{SKILL_KIND_LABEL[d.kind]}</span>}
        {showMeta && cats.length > 0 && <span className="hidden sm:inline text-[10px] text-mute/60">· {cats[0]}{cats.length > 1 ? ` +${cats.length - 1}` : ""}</span>}
      </button>
    );
  };

  const catById = {}; SKILL_CATEGORIES.forEach(c => { catById[c.id] = c; });
  const total = selections.length;

  return (
    <div className="space-y-4" data-testid="skill-picker">
      {/* Search */}
      <div className="relative">
        <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mute" />
        <input value={query} onChange={e => setQuery(e.target.value)} aria-label="Search skills"
          placeholder="Search programming languages, frameworks, tools and technologies..."
          className="w-full bg-panel2 border border-line rounded-xl pl-10 pr-10 py-3 text-sm text-ink placeholder:text-mute/60 focus:border-indigo/60 transition-colors" />
        {query && (
          <button type="button" aria-label="Clear search" onClick={() => setQuery("")}
            className="absolute right-3 top-1/2 -translate-y-1/2 text-mute hover:text-ink"><Icon name="x" size={15} /></button>
        )}
      </div>

      {/* Selected tray */}
      <div className="glass rounded-2xl p-4 border border-line">
        <div className="flex items-center justify-between gap-3 mb-2">
          <div className="text-sm font-medium" data-testid="skill-count">
            <span className="text-cyan font-mono">{total}</span> skill{total === 1 ? "" : "s"} selected
          </div>
          {total > 0 && (
            <button type="button" onClick={() => commit([])} className="text-xs text-mute hover:text-bad transition-colors">Clear all</button>
          )}
        </div>
        {total === 0 ? (
          <p className="text-xs text-mute">Nothing selected yet — pick any that apply. There's no minimum or maximum.</p>
        ) : (
          <div className="flex flex-wrap gap-2 skill-scroll !max-h-40" data-testid="skill-tray">
            {selections.map(s => (
              <span key={s.id} className="skill-pop inline-flex items-center gap-1 pl-3 pr-1.5 py-1 rounded-full text-sm bg-indigo/20 border border-indigo/50 text-white">
                {s.name}
                <button type="button" aria-label={`Remove ${s.name}`} data-remove={s.id}
                  onClick={() => commit(selections.filter(x => x.id !== s.id))}
                  className="w-5 h-5 rounded-full inline-flex items-center justify-center text-mute hover:text-white hover:bg-white/10">
                  <Icon name="x" size={12} strokeWidth={2.5} />
                </button>
              </span>
            ))}
          </div>
        )}
      </div>

      {/* Search results */}
      {q ? (
        <div className="space-y-4" data-testid="skill-results">
          {results.direct.length === 0 && results.related.length === 0 && (
            <p className="text-sm text-mute">No skills match “{q}”.</p>
          )}
          {results.direct.length > 0 && (
            <div>
              <div className="text-xs font-mono text-cyan mb-2">MATCHES · {results.direct.length}</div>
              <div className="flex flex-wrap gap-2">{results.direct.map(id => renderChip(id, true))}</div>
            </div>
          )}
          {results.related.length > 0 && (
            <div>
              <div className="text-xs font-mono text-mute mb-2">RELATED TO “{q.toUpperCase()}” · {results.related.length}</div>
              <div className="flex flex-wrap gap-2">{results.related.map(id => renderChip(id, true))}</div>
            </div>
          )}
          {!exact && (
            <button type="button" onClick={() => addCustom(q)} data-testid="add-custom"
              className="inline-flex items-center gap-2 text-sm text-cyan hover:text-ink transition-colors">
              <Icon name="plus" size={14} /> Add “{q}” as a custom skill
            </button>
          )}
        </div>
      ) : (
        /* Categories */
        <div className="space-y-3">
          {SKILL_CATEGORIES.map(cat => {
            const isOpen = !!open[cat.id];
            const count = cat.skills.filter(id => selectedIds[id]).length;
            const allOn = count === cat.skills.length;
            return (
              <div key={cat.id} className={`glass rounded-2xl border transition-colors ${count ? "border-indigo/30" : "border-line"} ${cat.defaultOpen ? "shadow-glow" : ""}`}>
                <button type="button" aria-expanded={isOpen} data-cat={cat.id}
                  onClick={() => setOpen(o => ({ ...o, [cat.id]: !o[cat.id] }))}
                  className="w-full flex items-center gap-3 px-4 py-3 text-left">
                  <span className="w-8 h-8 rounded-lg bg-indigo/15 text-indigo inline-flex items-center justify-center shrink-0"><Icon name={cat.icon} size={16} /></span>
                  <span className="min-w-0 flex-1">
                    <span className="block font-display font-medium text-sm md:text-base truncate">{cat.name}</span>
                    <span className="block text-xs text-mute truncate">{cat.description}</span>
                  </span>
                  <span className={`text-xs font-mono px-2 py-0.5 rounded-full shrink-0 ${count ? "bg-cyan/15 text-cyan" : "bg-white/5 text-mute"}`}>{count}/{cat.skills.length}</span>
                  <Icon name="chevron-down" size={16} className={`text-mute shrink-0 transition-transform ${isOpen ? "rotate-180" : ""}`} />
                </button>
                <div className={`skill-acc ${isOpen ? "open" : ""}`} aria-hidden={!isOpen}>
                  <div>
                    <div className="px-4 pb-4">
                      <div className="flex items-center gap-4 mb-3 text-xs">
                        <button type="button" disabled={allOn} onClick={() => addIds(cat.skills)} data-selectall={cat.id}
                          className="text-cyan hover:text-ink disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Select all</button>
                        <button type="button" disabled={!count} onClick={() => removeIds(cat.skills)} data-clearcat={cat.id}
                          className="text-mute hover:text-bad disabled:opacity-40 disabled:cursor-not-allowed transition-colors">Clear</button>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {isOpen && cat.skills.map(id => renderChip(id, false))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

}

function Field({ label, children }) {
  return (
    <label className="block mb-5">
      <span className="block text-sm text-mute mb-2">{label}</span>

}

const inputCls = "w-full bg-panel2 border border-line rounded-xl px-4 py-2.5 text-sm text-ink placeholder:text-mute/60 focus:border-indigo/60 transition-colors";

function Onboarding({ profile, setProfile, onComplete }) {
  const [step, setStep] = useState(1);
  const total = 5;
  const update = (patch) => setProfile(p => ({ ...p, ...patch }));

  const next = () => step < total ? setStep(step + 1) : onComplete();
  const back = () => step > 1 && setStep(step - 1);

  if (step === 1) {
    return (
      <StepShell step={1} total={total} title="Tell us about you" sub="This helps SkillPilot calibrate your baseline."
        onBack={back} onNext={next} nextDisabled={!profile.name}>
        <Field label="Full name">
          <input className={inputCls} value={profile.name} onChange={e => update({ name: e.target.value })} placeholder="e.g. Aditi Sharma" />
        </Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Education">
            <input className={inputCls} value={profile.education} onChange={e => update({ education: e.target.value })} placeholder="B.Tech" />
          </Field>
          <Field label="Branch / Major">
            <input className={inputCls} value={profile.branch} onChange={e => update({ branch: e.target.value })} placeholder="Computer Science" />
          </Field>
        </div>
        <Field label="Graduation year">
          <input className={inputCls} type="number" value={profile.gradYear} onChange={e => update({ gradYear: e.target.value })} placeholder="2026" />
        </Field>
      </StepShell>
    );
  }

  if (step === 2) {
    return (
      <StepShell step={2} total={total} title="What's your experience level?" onBack={back} onNext={next} nextDisabled={!profile.experience}>
        <div className="grid sm:grid-cols-2 gap-3">
          {EXPERIENCE_LEVELS.map(l => (
            <button key={l.id} onClick={() => update({ experience: l.id })}
              className={`text-left p-4 rounded-xl border glass transition-colors ${profile.experience === l.id ? "border-indigo shadow-glow" : "border-line hover:border-indigo/40"}`}>
              <div className="font-medium">{l.label}</div>
              <div className="text-xs text-mute mt-1">{l.desc}</div>
            </button>
          ))}
        </div>
      </StepShell>
    );
  }

  if (step === 3) {
    return (
      <StepShell step={3} total={total} title="What skills do you already have?" sub="Select what applies — SkillPilot will verify these against real evidence later."
        onBack={back} onNext={next}>
        <SkillPicker value={profile.currentSkills}
          onChange={(names, selections) => update({ currentSkills: names, skillSelections: selections })} />
      </StepShell>
    );
  }

  if (step === 4) {
    return (
      <StepShell step={4} total={total} title="Choose your target career" sub="Everything downstream — your twin, roadmap and assessments — is built around this."
        onBack={back} onNext={next} nextDisabled={!profile.careerId}>
        <CareerGrid selectedId={profile.careerId} onSelect={(id) => update({ careerId: id })} />
      </StepShell>
    );
  }

  return (
    <StepShell step={5} total={total} title="Connect your evidence" sub="Optional now — you can always add this later from your dashboard."
      onBack={back} onNext={next} nextLabel="Generate My Career Twin" nextDisabled={false}>
      <Field label="GitHub username (optional)">
        <div className="relative">
          <Icon name="github" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mute" />
          <input className={inputCls + " pl-10"} value={profile.githubUsername}
            onChange={e => update({ githubUsername: e.target.value })} placeholder="octocat" />
        </div>
      </Field>
      <Field label="Resume text (optional — paste for this demo instead of uploading a file)">
        <textarea className={inputCls + " min-h-[110px] resize-y"} value={profile.resumeText}
          onChange={e => update({ resumeText: e.target.value })}
          placeholder="Paste your resume text here, e.g. 'Built REST APIs in Python and deployed on AWS using Docker...' " />
      </Field>
      <Field label="Preferred technologies">
        <div className="flex flex-wrap gap-2">
          {COMMON_SKILLS.map(s => (
            <Chip key={s} active={profile.preferredTech.includes(s)}
              onClick={() => setProfile(p => ({ ...p, preferredTech: p.preferredTech.includes(s) ? p.preferredTech.filter(x => x !== s) : [...p.preferredTech, s] }))}>
              {s}
            </Chip>
          ))}
        </div>
      </Field>
    </StepShell>
  );
}

// ---------- Skill dependency graph (layered, generated from the career's own skills) ----------
function SkillGraph({ career, statusOf }) {
  const g = useMemo(() => careerGraph(career), [career.id]);
  const W = 156, H = 40, GX = 56, GY = 14, PAD = 8;
  const pos = {};
  let maxRows = 0;
  g.columns.forEach((col, ci) => {
    const sorted = [...col].sort((a, b) => b.weight - a.weight);
    maxRows = Math.max(maxRows, sorted.length);
    sorted.forEach((s, ri) => { pos[s.id] = { x: PAD + ci * (W + GX), y: PAD + ri * (H + GY) }; });
  });
  const width = PAD * 2 + g.columns.length * W + (g.columns.length - 1) * GX;
  const height = PAD * 2 + maxRows * H + (maxRows - 1) * GY;
  const trunc = (t) => (t.length > 21 ? t.slice(0, 20) + "…" : t);
  return (
    <div>
      <div className="overflow-x-auto pb-2">
        <svg width={width} height={height} role="img" aria-label={`${career.name} skill dependency graph`} data-testid="skill-graph" style={{ minWidth: width }}>
          <defs><marker id={"arr-" + career.id} markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="rgba(148,163,184,0.7)" /></marker></defs>
          {g.edges.map((e, i) => {
            const a = pos[e.from], b = pos[e.to]; if (!a || !b) return null;
            const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
            return <path key={i} d={`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}`} fill="none" stroke="rgba(148,163,184,0.45)" strokeWidth="1.4" markerEnd={`url(#arr-${career.id})`} />;
          })}
          {career.skills.map(s => {
            const p = pos[s.id]; if (!p) return null;
            const st = statusOf ? statusOf(s) : { tone: "indigo", label: "" };
            const hex = TONE_HEX[st.tone] || TONE_HEX.indigo;
            return (
              <g key={s.id} transform={`translate(${p.x},${p.y})`} data-graph-node={s.id}>
                <title>{s.name}{st.label ? ` — ${st.label}` : ""}</title>
                <rect width={W} height={H} rx="10" fill="#151B2E" stroke={hex} strokeOpacity="0.7" strokeWidth="1.3" />
                <rect width="4" height={H} rx="2" fill={hex} />
                <text x="14" y={H / 2 + 4} fill="#F8FAFC" fontSize="12" fontFamily="Inter, sans-serif">{trunc(s.name)}</text>
              </g>
            );
          })}
        </svg>
      </div>
      <div className="flex flex-wrap items-center gap-1.5 mt-3 text-xs" data-testid="learning-path">
        <span className="text-mute mr-1">Learning path:</span>
        {g.order.map((s, i) => (
          <span key={s.id} className="inline-flex items-center gap-1.5">
            <span className="px-2 py-0.5 rounded-full bg-white/5 text-ink/90">{s.name}</span>
            {i < g.order.length - 1 && <Icon name="arrow-right" size={11} className="text-mute" />}
          </span>
        ))}
      </div>
    </div>
  );
}

function GraphLegend({ items }) {

}
