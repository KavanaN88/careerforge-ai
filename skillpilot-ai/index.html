const pjSel = "bg-panel2 border border-line rounded-lg px-3 py-2 text-sm text-ink focus:outline-none focus:border-indigo/60 w-full";
const pjIn = "w-full bg-panel2 border border-line rounded-xl px-3.5 py-2.5 text-sm text-ink placeholder:text-mute/60 focus:outline-none focus:border-indigo/60";
const PJ_LV_TONE = { basic: "good", intermediate: "indigo", advanced: "warn" };
const PJ_STATUS_META = {
  "not-started": { label: "Not started", tone: "mute" }, "in-progress": { label: "In progress", tone: "cyan" },
  "self-reported": { label: "Self-reported", tone: "warn" }, submitted: { label: "Evidence submitted", tone: "indigo" }, verified: { label: "Verified", tone: "good" },
};
const pjDate = (iso) => { try { return iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : ""; } catch (e) { return ""; } };
const PJ_TABS = [["recommended", "Recommended"], ["all", "All projects"], ["career", "Career-based"], ["basic", "Basic"], ["intermediate", "Intermediate"], ["advanced", "Advanced"], ["recent", "Recently viewed"], ["progress", "In-progress"], ["completed", "Completed"]];
const PJ_PAGE = 24;

async function pjBrowserFetchJson(path) {
  let r;
  try { r = await fetch("https://api.github.com" + path, { headers: { Accept: "application/vnd.github+json" } }); }
  catch (e) { const er = new Error("Could not reach GitHub from the browser (offline or blocked)."); er.status = 0; throw er; }
  if (!r.ok) { const er = new Error(r.status === 404 ? "Repository not found (it must be public)." : r.status === 403 || r.status === 429 ? "GitHub API rate limit reached — try again later (unauthenticated limit is 60/hour)." : "GitHub returned " + r.status); er.status = r.status; throw er; }
  return r.json();
}
async function pjCheckUrl(url) {
  try { const c = new AbortController(); const t = setTimeout(() => c.abort(), 6000); await fetch(url, { mode: "no-cors", signal: c.signal }); clearTimeout(t); return true; } catch (e) { return false; }
}
// Runs a submission: server-side analysis when the backend is available, otherwise live GitHub analysis in the browser.
async function pjRunSubmission(p, sub, ctx) {
  const parsed = parseRepoUrl(sub.repoUrl);
  let evaluation = null, note = "";
  if (parsed) {
    if (API.available && API.token) {
      try { const r = await API.request("POST", `/api/projects/${p.id}/submit`, { submission: sub, startedAt: ctx.startedAt }); evaluation = r.evaluation; }
      catch (e) { note = "Server analysis unavailable (" + e.message + "); trying GitHub from your browser."; }
    }
    if (!evaluation) {
      try {
        const ev = await fetchRepoEvidence(parsed.owner, parsed.repo, pjBrowserFetchJson);
        evaluation = evaluateSubmission(p, ev, { githubUsername: ctx.githubUsername, submission: sub, startedAt: ctx.startedAt, verifiedBy: "browser" });
        if (API.available && API.token && evaluation.verification.status === "verified") // signed-in accounts: only the server can verify
          evaluation.verification = { ...evaluation.verification, status: "submitted", verifiedBy: null, reasons: ["The server could not analyse the repository, so this browser-side result is recorded as submitted. Resubmit when the server is reachable to be verified."] };
      }
      catch (e) { note = (note ? note + " " : "") + "Repository analysis failed: " + e.message; }
    }
  } else if (sub.repoUrl) note = "That does not look like a GitHub repository URL (https://github.com/owner/repo).";
  if (!evaluation) { evaluation = evaluateEvidenceOnly(p, sub, ctx); evaluation.analysisNote = note || "No repository supplied."; }
  else if (note) evaluation.analysisNote = note;
  if (sub.deployUrl && /^https?:\/\//i.test(sub.deployUrl)) {
    const live = await pjCheckUrl(sub.deployUrl);
    evaluation.flags = [...(evaluation.flags || []), { level: live ? "info" : "warn", text: live ? "Deployment URL responded from your browser (reachability only; content is not inspected)." : "Deployment URL did not respond from your browser." }];
  }
  return evaluation;
}

function ProjectVerification({ entry }) {
  const st = projectStatus({ x: entry }, "x"); const steps = [["self-reported", "Self-reported", "You marked it complete. Nothing is verified."], ["submitted", "Evidence submitted", "You provided links/text. Evidence is recorded but not independently confirmed."], ["verified", "Independently verified", "Your public repository was analysed live: ownership, originality and required skills were checked."]];

function ProjectTaskManager({ p, ws, entry, update }) {

  return (
    <div className="space-y-3" data-testid="task-manager">
      {ws.phases.map((ph, pi) => { const done = ph.tasks.filter(t => tasks[t.id]).length; const isOpen = open === ph.id; return (
        <Card key={ph.id} className="overflow-hidden">
          <button className="w-full flex items-center justify-between gap-3 p-4 text-left" onClick={() => setOpen(isOpen ? null : ph.id)} aria-expanded={isOpen}>

            <div className="flex items-center gap-3"><span className={`text-sm font-mono ${done === ph.tasks.length ? "text-good" : "text-mute"}`}>{done}/{ph.tasks.length}</span><Icon name={isOpen ? "chevron-down" : "chevron-right"} size={16} /></div>

function AIProjectMentor({ p, entry, update }) {
  const [text, setText] = useState(""); const endRef = useRef(null);
  const log = entry?.mentorLog || [];
  const ask = (q) => {
    const msg = (q ?? text).trim(); if (!msg) return;
    const r = projectMentorReply(p, msg, { entry });
    update(e => ({ ...e, mentorLog: [...(e.mentorLog || []), { role: "user", text: msg }, { role: "mentor", title: r.title, text: JSON.stringify(r) }].slice(-30) }));
    setText("");
  };
  useEffect(() => { endRef.current && endRef.current.scrollIntoView && endRef.current.scrollIntoView({ block: "nearest" }); }, [log.length]);
  const quick = ["Explain the requirements", "Explain the architecture", "What should I do next?", "Explain " + pjSkillName(p.skills[0]), "Help me with the README", "How do I improve this?"];
  return (
    <Card className="p-5" data-testid="mentor">
      <div className="flex items-center gap-2 mb-1"><Icon name="bot" size={18} /><div className="font-display font-medium">AI Project Mentor</div><Badge tone="mute">rule-based · teaches, doesn't write your project</Badge></div>
      <div className="flex flex-wrap gap-2 my-3">{quick.map(q => <Chip key={q} onClick={() => ask(q)}>{q}</Chip>)}</div>
      <div className="space-y-3 max-h-[460px] overflow-y-auto pr-1" data-testid="mentor-log">
        {!log.length && <p className="text-sm text-mute">Ask about requirements, architecture, a technology, an error you hit, or paste code to have it explained and reviewed.</p>}
        {log.map((m, i) => { if (m.role === "user") return <div key={i} className="ml-auto max-w-[85%] rounded-xl bg-indigo/20 border border-indigo/30 px-3.5 py-2 text-sm whitespace-pre-wrap">{m.text}</div>;
          let r; try { r = JSON.parse(m.text); } catch (e) { r = { title: m.title, paragraphs: [m.text], bullets: [], questions: [], resources: [] }; }
          return (<div key={i} className="max-w-[92%] rounded-xl bg-panel2 border border-line px-4 py-3 text-sm space-y-2" data-testid="mentor-reply">
            <div className="font-medium text-cyan">{r.title}</div>
            {r.paragraphs.map((x, j) => <p key={j} className="text-ink/90">{x}</p>)}
            {r.bullets.length > 0 && <ul className="space-y-1">{r.bullets.map((x, j) => <li key={j} className="text-mute">• {x}</li>)}</ul>}
            {r.resources.length > 0 && <div><div className="text-xs font-mono uppercase text-mute">Study</div>{r.resources.map((x, j) => <div key={j} className="text-mute">📖 {x}</div>)}</div>}
            {r.questions.length > 0 && <div className="border-t border-line pt-2"><div className="text-xs font-mono uppercase text-mute mb-1">Think about</div>{r.questions.map((x, j) => <div key={j} className="text-amber-200/90">? {x}</div>)}</div>}
          </div>); })}
        <div ref={endRef} />
      </div>
      <div className="flex gap-2 mt-4 items-end">
        <textarea className={pjIn + " min-h-[44px] max-h-40"} rows={2} value={text} onChange={e => setText(e.target.value)} placeholder="Ask a question, paste an error, or paste code to review…" data-testid="mentor-input"
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } }} />
        <Button icon="send" onClick={() => ask()} data-testid="mentor-send" aria-label="Send">Ask</Button>
      </div>
    </Card>
  );
}

function ProjectSubmission({ p, entry, update, profile, ctx, onDone }) {
  const sub0 = entry?.submission || {};
  const [f, setF] = useState({ repoUrl: sub0.repoUrl || "", deployUrl: sub0.deployUrl || "", videoUrl: sub0.videoUrl || "", docsText: sub0.docsText || "", testResults: sub0.testResults || "", shots: (sub0.screenshots || []).join("\n"), notes: sub0.notes || "" });
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const submit = async () => {
    setErr(""); if (!f.repoUrl.trim() && !f.docsText.trim() && !f.testResults.trim() && !f.deployUrl.trim()) { setErr("Provide at least a GitHub repository URL (needed for verification) or some evidence."); return; }
    setBusy(true);
    const sub = { repoUrl: f.repoUrl.trim(), deployUrl: f.deployUrl.trim(), videoUrl: f.videoUrl.trim(), docsText: f.docsText.slice(0, 6000), testResults: f.testResults.slice(0, 3000), screenshots: f.shots.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 8), notes: f.notes.slice(0, 1000), submittedAt: pjNow() };
    try {
      const ev = await pjRunSubmission(p, sub, { githubUsername: profile.githubUsername, startedAt: entry?.startedAt, submission: sub });
      update(e => {
        const st = e.status === "verified" && ev.verification.status !== "verified" ? "submitted" : ev.verification.status; // resubmission can downgrade
        return { ...e, status: st, submission: sub, evaluation: ev, history: [...(e.history || []), { at: ev.at, overall: ev.overall, status: ev.verification.status, mode: ev.mode }].slice(-10) };
      });
      onDone();
    } catch (e) { setErr("Submission failed: " + e.message); }
    setBusy(false);
  };
  return (
    <Card className="p-6" data-testid="submission">
      <div className="font-display font-medium text-lg">Submit evidence</div>
      <p className="text-sm text-mute mt-1 mb-4">Provide a <b>public GitHub repository</b> to be eligible for independent verification. Other evidence is recorded and scored, but is self-provided and can never reach “verified” on its own. You can resubmit as often as you like.</p>
      {!profile.githubUsername && <div className="rounded-xl border border-warn/40 bg-warn/10 p-3 text-sm text-warn mb-4">Add your GitHub username in Profile → Settings so SkillPilot can confirm the repository is yours.</div>}
      <div className="grid md:grid-cols-2 gap-4">
        <label className="block md:col-span-2"><span className="text-xs text-mute">GitHub repository URL *</span><input className={pjIn + " mt-1"} placeholder="https://github.com/your-username/your-project" value={f.repoUrl} onChange={set("repoUrl")} data-testid="repo-url" /></label>
        <label className="block"><span className="text-xs text-mute">Deployment URL (optional)</span><input className={pjIn + " mt-1"} placeholder="https://your-app.example.com" value={f.deployUrl} onChange={set("deployUrl")} /></label>
        <label className="block"><span className="text-xs text-mute">Demo video URL (optional)</span><input className={pjIn + " mt-1"} placeholder="https://youtu.be/…" value={f.videoUrl} onChange={set("videoUrl")} /></label>
        <label className="block md:col-span-2"><span className="text-xs text-mute">Screenshot links, one per line (optional)</span><textarea className={pjIn + " mt-1"} rows={2} value={f.shots} onChange={set("shots")} /></label>
        <label className="block"><span className="text-xs text-mute">Test results (paste output, e.g. “24 passed, coverage 82%”)</span><textarea className={pjIn + " mt-1"} rows={4} value={f.testResults} onChange={set("testResults")} /></label>
        <label className="block"><span className="text-xs text-mute">Documentation / report text (optional)</span><textarea className={pjIn + " mt-1"} rows={4} value={f.docsText} onChange={set("docsText")} /></label>
      </div>
      {err && <div className="text-sm text-bad mt-3" role="alert">{err}</div>}
      <div className="flex items-center gap-3 mt-5"><Button onClick={submit} disabled={busy} icon={busy ? "refresh" : "upload"} data-testid="submit-evidence">{busy ? "Analysing repository…" : entry?.evaluation ? "Resubmit & re-evaluate" : "Submit & analyse"}</Button>
        <span className="text-xs text-mute">The repository is read through GitHub's public API; code is analysed, never executed.</span></div>
    </Card>
  );
}

function ProjectEvaluation({ p, entry, setTab }) {

  const v = ev.verification; const tone = v.status === "verified" ? "good" : "indigo";
  const SK = { detected: ["good", "Detected in code"], mentioned: ["warn", "Mentioned only"], missing: ["bad", "Not found"], unassessed: ["mute", "Not automatically checkable"] };
  return (
    <div className="space-y-4" data-testid="evaluation">
      <Card className="p-6 flex flex-wrap gap-6 items-center">
        <ScoreRing score={ev.overall} size={120} label={String(ev.overall)} sub="overall" />
        <div className="flex-1 min-w-[240px]"><div className="flex items-center gap-2 flex-wrap"><Badge tone={tone}>{v.status === "verified" ? "Independently verified" : "Evidence submitted — not verified"}</Badge><Badge tone="mute">{ev.mode === "repository" ? "Repository analysed: " + (ev.repo || "") : "Evidence only"}</Badge></div>
          <ul className="mt-3 space-y-1">{v.reasons.map((r, i) => <li key={i} className="text-sm text-mute">{v.status === "verified" ? "✓" : "•"} {r}</li>)}</ul>
          {ev.analysisNote && <p className="text-xs text-warn mt-2">{ev.analysisNote}</p>}
          <p className="text-[11px] text-mute mt-2">{v.note || "Automated checks of submitted evidence."} Evaluated {pjDate(ev.at)}.</p></div>
      </Card>
      <div className="grid md:grid-cols-2 gap-4">
        <Card className="p-5 space-y-3"><div className="text-xs font-mono uppercase tracking-widest text-mute">Scores</div>

function buildRoadmap(career, skillState) {
  const memo = {};
  const withLevel = career.skills.map(s => ({ skill: s, level: skillLevel(s, career, memo), conf: skillState[s.id]?.score ?? 0 }));
  withLevel.sort((a, b) => a.level - b.level || a.conf - b.conf);
  return withLevel;
}

function statusFor(conf, target = 75) {
  if (conf >= target) return { label: "Complete", tone: "good", icon: "check" };
  if (conf >= 40) return { label: "In progress", tone: "warn", icon: "clock" };
  return { label: "Not started", tone: "bad", icon: "x" };
}

function LineChart({ series, width = 640, height = 220, color = "#06B6D4" }) {
  const pad = 28;
  const max = 100, min = 0;
  const w = width - pad * 2;
  const h = height - pad * 2;
  const stepX = series.length > 1 ? w / (series.length - 1) : 0;
  const points = series.map((v, i) => {
    const x = pad + i * stepX;
    const y = pad + h - ((v.value - min) / (max - min)) * h;
    return { x, y, ...v };
  });
  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const areaPath = `${path} L ${points[points.length - 1].x.toFixed(1)} ${pad + h} L ${points[0].x.toFixed(1)} ${pad + h} Z`;
  const gridLines = [0, 25, 50, 75, 100];

  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {gridLines.map(g => {
        const y = pad + h - (g / 100) * h;
        return (
          <g key={g}>
            <line x1={pad} y1={y} x2={width - pad} y2={y} stroke="rgba(148,163,184,0.12)" strokeWidth="1" />
            <text x={4} y={y + 3} fontSize="9" fill="#94A3B8" fontFamily="JetBrains Mono, monospace">{g}</text>
          </g>
        );
      })}
      <path d={areaPath} fill="url(#areaFill)" />
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r={i === points.length - 1 ? 5 : 3.5} fill={i === points.length - 1 ? color : "#151B2E"} stroke={color} strokeWidth="2" />
          <text x={p.x} y={height - 6} fontSize="10" textAnchor="middle" fill="#94A3B8" fontFamily="Inter, sans-serif">{p.label}</text>
        </g>
      ))}
    </svg>
  );
}

function generateAssistantReply(question, ctx) {
  const q = question.toLowerCase();
  const { career, skillState, nba, readiness, githubData, resumeData, subScores } = ctx;

  const weakest = [...career.skills].sort((a, b) => (skillState[a.id]?.score ?? 0) - (skillState[b.id]?.score ?? 0))[0];
  const strongest = [...career.skills].sort((a, b) => (skillState[b.id]?.score ?? 0) - (skillState[a.id]?.score ?? 0))[0];

  const skillMentioned = career.skills.find(s => q.includes(s.name.toLowerCase()) || q.includes(s.id));

  if (skillMentioned && /low|why|weak|score/.test(q)) {
    const ev = skillState[skillMentioned.id];
    const missingBits = [];
    if (!ev?.breakdown?.length || ev.score < 50) missingBits.push("hasn't been backed by enough evidence yet");
    return `${skillMentioned.name} is currently at ${ev?.score ?? 0}/100. That score comes from resume mentions, GitHub proof, deployments, assessments and interviews — right now it ${missingBits[0] || "has some evidence but could use more"}. The fastest lever: submit a proof-of-skill project that uses ${skillMentioned.name} directly.`;
  }

  if (/what should i learn|learn next|next skill/.test(q)) {
    return `Based on your twin, ${weakest.name} has the most leverage right now — it's foundational to ${career.name} but your evidence for it is thin (${skillState[weakest.id]?.score ?? 0}/100). I'd start there.`;
  }

  if (/which project|what project|build/.test(q)) {
    if (nba) return `I'd build "${nba.project.name}" — ${nba.project.description} It directly proves ${nba.skill.name}, your highest-leverage gap.`;
    return `Head to the Projects page — I'll match a proof-of-skill project to your current biggest gap once your twin has a bit more data.`;
  }

  if (/not ready|why am i not ready|readiness/.test(q)) {
    const parts = Object.entries(subScores).sort((a, b) => a[1] - b[1]).slice(0, 2);
    const labelMap = { skillConfidenceAvg: "skill confidence", githubScore: "GitHub portfolio", resumeMatch: "resume match", projectEvidencePct: "project evidence", assessmentAvg: "assessment score", interviewAvg: "interview readiness" };
    return `Your Career Readiness is ${readiness}/100. The two areas pulling it down most are ${labelMap[parts[0][0]]} (${Math.round(parts[0][1])}) and ${labelMap[parts[1][0]]} (${Math.round(parts[1][1])}). Improving either will move the needle fastest.`;
  }

  if (/github|improve my github|portfolio/.test(q)) {
    if (!githubData) return `You haven't connected GitHub yet — head to the GitHub Analyzer and enter your username. That alone will likely move your readiness score.`;
    return `Your GitHub Portfolio Score is ${Math.round(githubData.portfolioScore)}/100. Documentation quality is at ${githubData.docQuality} — adding clear READMEs with setup steps and screenshots to your top ${career.name}-relevant repos is the quickest win.`;
  }

  if (/interview|prepare for.*interview|prep/.test(q)) {
    return `For a ${career.name} interview, expect deep questions on ${strongest.name} and ${weakest.name}. Practice explaining trade-offs out loud, not just what you built — that's usually where candidates lose points.`;
  }

  if (/resume/.test(q)) {
    if (!resumeData) return `Paste your resume in the Resume Intelligence page and I'll tell you exactly which ${career.name} skills are missing from it.`;
    return `Your resume match is ${resumeData.matchPct}%. ${resumeData.missing.length ? `Add concrete evidence for ${resumeData.missing.slice(0,2).map(s=>s.name).join(", ")}.` : "It already covers your core skill list well."}`;
  }

  return `Here's where things stand: Career Readiness is ${readiness}/100, your strongest skill is ${strongest.name}, and your biggest gap is ${weakest.name}. Ask me things like "why is my ${weakest.name} score low" or "what should I build next" for specifics.`;
}

function Assistant(ctx) {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { role: "assistant", text: "I'm connected to your Career Digital Twin. Ask me why a score is what it is, what to learn next, or what to build." },
  ]);
  const [input, setInput] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  const send = () => {
    if (!input.trim()) return;
    const userMsg = { role: "user", text: input.trim() };
    const reply = { role: "assistant", text: generateAssistantReply(input.trim(), ctx) };
    setMessages(m => [...m, userMsg, reply]);
    setInput("");
  };

  const suggestions = ["What should I learn next?", "Why is my weakest skill low?", "Which project should I build?", "Why am I not ready for this job?"];

  return (
    <React.Fragment>
      <button onClick={() => setOpen(o => !o)}
        className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-gradient-to-br from-indigo to-cyan shadow-glow flex items-center justify-center text-white hover:scale-105 transition-transform">
        <Icon name={open ? "x" : "message-circle"} size={22} />
      </button>

      {open && (
        <div className="fixed bottom-24 right-6 z-40 w-[min(380px,calc(100vw-2.5rem))] h-[min(520px,calc(100vh-9rem))] glass-strong rounded-2xl shadow-glow flex flex-col fade-up overflow-hidden">
          <div className="px-5 py-4 border-b border-line flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo to-cyan flex items-center justify-center"><Icon name="sparkles" size={15} className="text-white" /></div>
            <div>
              <div className="font-display font-medium text-sm">Career Intelligence Assistant</div>
              <div className="text-[11px] text-mute">Answers from your actual twin data</div>
            </div>
          </div>
          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
            {messages.map((m, i) => (
              <div key={i} className={`text-sm max-w-[88%] px-3.5 py-2.5 rounded-2xl leading-relaxed ${m.role === "user" ? "ml-auto bg-indigo/20 text-ink rounded-br-sm" : "bg-white/5 text-ink/90 rounded-bl-sm"}`}>
                {m.text}
              </div>
            ))}
          </div>
          <div className="px-4 pb-3 flex flex-wrap gap-1.5">
            {suggestions.slice(0, 2).map(s => (
              <button key={s} onClick={() => { setInput(s); }} className="text-[11px] chip px-2.5 py-1 rounded-full text-mute hover:text-ink">{s}</button>
            ))}
          </div>
          <div className="p-3 border-t border-line flex items-center gap-2">
            <input className="flex-1 bg-panel2 border border-line rounded-xl px-3.5 py-2 text-sm focus:border-indigo/60"
              value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()}
              placeholder="Ask about your career twin..." />
            <button onClick={send} className="w-9 h-9 rounded-xl bg-indigo/20 text-indigo flex items-center justify-center hover:bg-indigo/30 shrink-0">
              <Icon name="send" size={15} />
            </button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

  { id: "roadmap", label: "Roadmap", icon: "git-branch" },
  { id: "progress", label: "Progress", icon: "trending-up" },
  { id: "report", label: "Career Report", icon: "award" },
];

const PAGE_TITLES = { profile: "My Profile", settings: "Settings" };

function Shell({ view, setView, profile, readiness, children, onRequestLogout, notifications }) {
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const career = CAREERS.find(c => c.id === profile.careerId);

  const SidebarContent = () => (
    <React.Fragment>
      <div className="flex items-center gap-2.5 px-5 h-16 shrink-0">
        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo to-cyan flex items-center justify-center">
          <Icon name="target" size={17} className="text-white" />
        </div>
        <span className="font-display font-semibold tracking-tight">SkillPilot <span className="text-gradient">AI</span></span>
      </div>
      <nav className="flex-1 overflow-y-auto px-3 py-2 space-y-1">
        {NAV_ITEMS.map(item => (
          <button key={item.id} onClick={() => { setView(item.id); setMobileNavOpen(false); }}
            className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm transition-colors ${view === item.id ? "bg-indigo/15 text-white border border-indigo/30" : "text-mute hover:text-ink hover:bg-white/5 border border-transparent"}`}>
            <Icon name={item.icon} size={16} />
            {item.label}

      </nav>
      <div className="p-4 border-t border-line">
        <button onClick={() => { setView("profile"); setMobileNavOpen(false); }} className="w-full flex items-center gap-3 px-1 mb-2 hover:bg-white/5 rounded-lg py-1.5 -mx-1 transition-colors">
          <Avatar name={profile.name} size={36} />
          <div className="min-w-0 text-left">
            <div className="text-sm font-medium truncate">{profile.name || "Guest"}</div>
            <div className="text-xs text-mute truncate">{career?.name || "No career selected"}</div>
          </div>
        </button>
        <div className="flex gap-1">
          <Button variant="ghost" size="sm" className="flex-1 !justify-start" icon="settings" onClick={() => { setView("settings"); setMobileNavOpen(false); }}>Settings</Button>
          <Button variant="ghost" size="sm" className="flex-1 !justify-start !text-bad" icon="log-out" onClick={onRequestLogout}>Log out</Button>
        </div>
      </div>
    </React.Fragment>
  );

  return (
    <div className="min-h-screen flex">
      {/* Desktop sidebar */}
      <aside className="hidden lg:flex flex-col w-64 shrink-0 border-r border-line bg-panel/60 sticky top-0 h-screen">
        <SidebarContent />
      </aside>

      {/* Mobile sidebar overlay */}
      {mobileNavOpen && (
        <div className="fixed inset-0 z-50 lg:hidden">
          <div className="absolute inset-0 bg-black/60" onClick={() => setMobileNavOpen(false)} />
          <aside className="absolute left-0 top-0 h-full w-72 bg-panel border-r border-line flex flex-col fade-up">
            <SidebarContent />
          </aside>
        </div>
      )}

      <div className="flex-1 min-w-0 flex flex-col">
        {/* Topbar */}
        <div className="h-16 border-b border-line flex items-center justify-between px-4 md:px-8 sticky top-0 bg-navy/80 backdrop-blur-md z-30 shrink-0">
          <div className="flex items-center gap-3">
            <button className="lg:hidden text-mute" onClick={() => setMobileNavOpen(true)}>
              <Icon name="grid" size={20} />
            </button>
            <span className="text-sm text-mute hidden sm:block">
              {PAGE_TITLES[view] || NAV_ITEMS.find(n => n.id === view)?.label || "Dashboard"}
            </span>
          </div>
          <div className="flex items-center gap-3">
            <div className="hidden sm:flex items-center gap-2 chip rounded-full pl-3 pr-1 py-1">
              <span className="text-xs text-mute">Readiness</span>
              <span className={`font-mono text-xs font-semibold px-2 py-0.5 rounded-full ${readiness >= 75 ? "bg-good/20 text-good" : readiness >= 45 ? "bg-warn/20 text-warn" : "bg-bad/20 text-bad"}`}>
                {readiness}/100
              </span>
            </div>
            <NotificationBell items={notifications} />
            <ProfileDropdown profile={profile} career={career} setView={setView} onRequestLogout={onRequestLogout} />
          </div>
        </div>

        <main className="flex-1 min-w-0">{children}</main>
      </div>
    </div>
  );
}

// ==== src/app.js ====
function loadJSON(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable — demo still works, just won't persist */ }
}

function emptyProfile() {
  return {
    name: "", education: "", branch: "", gradYear: "", experience: "",
    currentSkills: [], skillSelections: [], careerId: "", careerLevel: "", secondaryCareers: [], recentCareers: [], githubUsername: "", resumeText: "", preferredTech: [],
  };
}

function genHistory(seedStr, currentValue) {
  const seed = hashString(seedStr);
  const months = MONTH_LABELS.slice(0, 5);
  let v = clampNum(seededRandomRange(seedStr + "start", 28, 46));
  const points = months.map((label, i) => {
    v = clampNum(v + seededRandomRange(seedStr + i, 4, 12));
    return { label, value: Math.min(v, currentValue) };
  });
  points.push({ label: "Now", value: currentValue });
  return points;
}

function App() {
  const [profile, setProfile] = useState(() => loadJSON("skillpilot:profile", emptyProfile()));
  const [isAuthenticated, setIsAuthenticated] = useState(() => loadJSON("skillpilot:isAuthenticated", false));
  const [authUser, setAuthUser] = useState(() => loadJSON("skillpilot:authUser", null));

  const [githubData, setGithubData] = useState(() => loadJSON("skillpilot:githubData", null));
  const [resumeData, setResumeData] = useState(() => loadJSON("skillpilot:resumeData", null));
  const [assessmentResults, setAssessmentResults] = useState(() => loadJSON("skillpilot:assessmentResults", {}));
  const [assessmentHistory, setAssessmentHistory] = useState(() => loadJSON("skillpilot:assessmentHistory", []));
  const [interviewHistory, setInterviewHistory] = useState(() => loadJSON("skillpilot:interviewHistory", []));
  const [interviewResult, setInterviewResult] = useState(() => loadJSON("skillpilot:interviewResult", null));
  const [completedProjects, setCompletedProjects] = useState(() => loadJSON("skillpilot:completedProjects", []));
  const [projectState, setProjectState] = useState(() => sanitizeProjectState(loadJSON("skillpilot:projectState", {})));

  const [stage, setStage] = useState(() => {
    const auth = loadJSON("skillpilot:isAuthenticated", false);
    const prof = loadJSON("skillpilot:profile", emptyProfile());
    if (auth && prof.careerId) return "app";
    if (auth) return "onboarding";
    return "landing";
  });
  const [view, setView] = useState("dashboard");
  const [, setApiChecked] = useState(false);   // re-render once backend detection finishes
  const [syncOn, setSyncOn] = useState(false);   // true once a signed-in user's data is loaded from the server
  const [logoutConfirmOpen, setLogoutConfirmOpen] = useState(false);

  // Hydrate the manual "reduce motion" preference once on mount.
  useEffect(() => {
    try {
      if (localStorage.getItem("skillpilot:reduceMotion") === "1") document.body.classList.add("reduce-motion");
    } catch (e) { /* ignore */ }
  }, []);

  // Apply a state document from the server to React state (server is the source of truth when signed in).
  const applyServerState = (st) => {
    setProfile({ ...emptyProfile(), ...st.profile });
    setGithubData(st.githubData || null);
    setResumeData(st.resumeData || null);
    setAssessmentResults(st.assessmentResults || {});
    setAssessmentHistory(Array.isArray(st.assessmentHistory) ? st.assessmentHistory : []);
    setInterviewResult(st.interviewResult || null);
    setInterviewHistory(Array.isArray(st.interviewHistory) ? st.interviewHistory : []);
    setCompletedProjects(st.completedProjects || []);
    setProjectState(sanitizeProjectState(st.projectState));
  };

  // Detect the backend once; if a saved token exists, restore the session from the database.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const up = await API.detect();
      if (!cancelled) setApiChecked(true);
      if (!up || !API.token || cancelled) return;
      try {
        const [{ user }, st] = await Promise.all([API.me(), API.loadState()]);
        if (cancelled) return;
        applyServerState(st);
        setAuthUser({ email: user.email }); setIsAuthenticated(true); setSyncOn(true);
        setStage(s => (s === "login" || s === "signup") ? s : (st.profile.careerId ? "app" : "onboarding"));
      } catch (e) {
        if (e.status === 401) { API.setToken(null); setIsAuthenticated(false); }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Push changes to PostgreSQL (debounced) while signed in to the backend.
  useEffect(() => {
    if (!syncOn || !API.available || !API.token) return;
    const t = setTimeout(() => {
      API.saveState({ profile, githubData, resumeData, assessmentResults, assessmentHistory, interviewResult, interviewHistory, completedProjects, projectState }).catch(() => {});
    }, 700);
    return () => clearTimeout(t);
  }, [syncOn, profile, githubData, resumeData, assessmentResults, assessmentHistory, interviewResult, interviewHistory, completedProjects, projectState]);

  // Persist everything relevant so a page refresh doesn't lose the session or the twin.
  useEffect(() => saveJSON("skillpilot:profile", profile), [profile]);
  useEffect(() => saveJSON("skillpilot:isAuthenticated", isAuthenticated), [isAuthenticated]);
  useEffect(() => saveJSON("skillpilot:authUser", authUser), [authUser]);
  useEffect(() => saveJSON("skillpilot:githubData", githubData), [githubData]);
  useEffect(() => saveJSON("skillpilot:resumeData", resumeData), [resumeData]);
  useEffect(() => saveJSON("skillpilot:assessmentResults", assessmentResults), [assessmentResults]);
  useEffect(() => saveJSON("skillpilot:assessmentHistory", assessmentHistory), [assessmentHistory]);
  useEffect(() => saveJSON("skillpilot:interviewResult", interviewResult), [interviewResult]);
  useEffect(() => saveJSON("skillpilot:interviewHistory", interviewHistory), [interviewHistory]);
  // Interview evidence: aggregate of recent interviews (level-weighted); falls back to a legacy single result.
  const interviewAgg = useMemo(() => interviewAggregate(interviewHistory) || interviewResult, [interviewHistory, interviewResult]);
  useEffect(() => saveJSON("skillpilot:completedProjects", completedProjects), [completedProjects]);
  useEffect(() => saveJSON("skillpilot:projectState", projectState), [projectState]);

  const career = CAREERS.find(c => c.id === profile.careerId) || CAREERS[0];

  // ---- Evidence map + skill confidence (the core "Digital Twin" computation) ----
  // Only skills DETECTED in a verified project count; self-reported/legacy completion earns nothing.
  const projectEvidence = useMemo(() => projectEvidenceSkills(projectState), [projectState]);
  const evidenceMap = useMemo(() => {
    const map = {};
    const claimCtx = claimContext(profile.currentSkills);
    career.skills.forEach(s => {
      const claimed = isSkillClaimed(s, claimCtx);
      map[s.id] = {
        skillId: s.id,
        resumeMention: resumeData ? resumeData.matched.some(m => m.id === s.id) : false,
        githubProject: githubData ? githubData.evidencedSkills.includes(s.id) : false,
        deploymentEvidence: projectEvidence.verified.has(s.id),
        assessmentScore: assessmentResults[s.id] ?? null,
        interviewScore: interviewHistory.length ? interviewSkillEvidence(interviewHistory, s.id) : (interviewResult ? Math.round(interviewResult.scores.technical / 10) : null),
        claimedOnly: claimed,
      };
    });
    return map;
  }, [career, profile.currentSkills, resumeData, githubData, projectEvidence, assessmentResults, interviewResult, interviewHistory]);

  const skillState = useMemo(() => {
    const state = {};
    career.skills.forEach(s => { state[s.id] = computeSkillConfidence(evidenceMap[s.id]); });
    return state;
  }, [career, evidenceMap]);

  const subScores = useMemo(() => {
    const skillConfidenceAvg = career.skills.length
      ? career.skills.reduce((sum, s) => sum + (skillState[s.id]?.score ?? 0), 0) / career.skills.length : 0;
    const assessedSkills = career.skills.filter(s => assessmentResults[s.id] !== undefined);
    const assessmentAvg = assessedSkills.length
      ? assessedSkills.reduce((sum, s) => sum + assessmentResults[s.id] * 10, 0) / assessedSkills.length : 0;
    const projectCoveredSkills = career.skills.filter(s => evidenceMap[s.id]?.deploymentEvidence).length;
    return {
      skillConfidenceAvg,
      githubScore: githubData?.portfolioScore ?? 0,
      resumeMatch: resumeData?.matchPct ?? 0,
      projectEvidencePct: career.skills.length ? (projectCoveredSkills / career.skills.length) * 100 : 0,
      assessmentAvg,
      interviewAvg: interviewAgg ? (interviewAgg.scores.technical + interviewAgg.scores.communication + interviewAgg.scores.problemSolving) / 3 : 0,
    };
  }, [career, skillState, assessmentResults, githubData, resumeData, evidenceMap, interviewAgg]);

  const readiness = useMemo(() => computeReadiness(subScores), [subScores]);
  const nba = useMemo(() => nextBestAction(career, skillState, projectsForCareer(career)), [career, skillState]);

  const notifications = useMemo(() => {
    const items = [];
    if (githubData) items.push({ icon: "github", text: "Your GitHub analysis is complete.", tone: "cyan" });
    if (resumeData) items.push({ icon: "file-text", text: "Your resume was analyzed against your target career.", tone: "indigo" });
    const vp = Object.keys(projectState).filter(id => projectState[id].status === "verified" && PROJECT_BY_ID[id]);
    if (vp.length) items.push({ icon: "layers", text: `"${PROJECT_BY_ID[vp[vp.length - 1]].name}" was independently verified and your evidence was updated.`, tone: "good" });
    if (Object.keys(assessmentResults).length > 0) items.push({ icon: "brain-circuit", text: "New assessment result added to your Career Digital Twin.", tone: "cyan" });
    if (nba) items.push({ icon: "zap", text: `New proof-of-skill project available for ${nba.skill.name}.`, tone: "indigo" });
    return items;
  }, [githubData, resumeData, projectState, assessmentResults, nba]);

  const historySeed = (profile.name || "guest") + career.id;
  const history = useMemo(() => genHistory(historySeed, readiness), [historySeed, readiness]);
  const subScoreHistory = useMemo(() => ({
    skillConfidenceAvg: genHistory(historySeed + "sc", subScores.skillConfidenceAvg),
    githubScore: genHistory(historySeed + "gh", subScores.githubScore),
    assessmentAvg: genHistory(historySeed + "as", subScores.assessmentAvg),
    interviewAvg: genHistory(historySeed + "iv", subScores.interviewAvg),
  }), [historySeed, subScores]);

  // ---- Handlers ----
  const handleGithubAnalyze = (username) => setGithubData(analyzeGithub(username, career.skills));
  const handleResumeAnalyze = (text) => setResumeData(analyzeResume(text, career));
  // A finished attempt: append to history and store the composite 0-10 evidence score for the skill.
  // In backend mode the server has already merged the same values into the database.
  const handleAttemptComplete = ({ entry, score10, serverState }) => {
    if (serverState && serverState.assessmentHistory) {
      setAssessmentHistory(serverState.assessmentHistory); setAssessmentResults(serverState.assessmentResults || {});
    } else {
      setAssessmentHistory(prev => [...prev, entry].slice(-500));
      setAssessmentResults(prev => ({ ...prev, [entry.skillId]: score10 }));
    }
  };
  const handleInterviewComplete = (entry) => setInterviewHistory(prev => [...prev, entry].slice(-60));
  const handleProjectSubmit = (projectId) => setCompletedProjects(prev => prev.includes(projectId) ? prev : [...prev, projectId]);
  const handleChangeCareer = (careerId) => setProfile(p => ({ ...p, careerId }));

  const handleGetStartedFromLanding = () => {
    if (isAuthenticated && profile.careerId) { setStage("app"); setView("dashboard"); }
    else if (isAuthenticated) { setStage("onboarding"); }
    else { setStage("signup"); }
  };

  const handleLogin = async ({ email, password }) => {
    if (API.available) {
      try {
        const { token, user } = await API.login(email, password);
        API.setToken(token);
        const st = await API.loadState();
        applyServerState(st);
        setAuthUser({ email: user.email }); setIsAuthenticated(true); setSyncOn(true);
        if (st.profile.name && st.profile.careerId) { setStage("app"); setView("dashboard"); }
        else { setStage("onboarding"); }
        return;
      } catch (e) { return e.message || "Could not log in."; }
    }
    await new Promise(r => setTimeout(r, 500));   // demo mode (no backend)
    setIsAuthenticated(true);
    setAuthUser({ email });
    if (profile.name && profile.careerId) { setStage("app"); setView("dashboard"); }
    else { setStage("onboarding"); }
  };

  const handleSignup = async ({ name, email, password }) => {
    if (API.available) {
      try {
        const { token, user } = await API.signup(name, email, password);
        API.setToken(token);
        applyServerState({ profile: { ...emptyProfile(), name } });
        setAuthUser({ email: user.email }); setIsAuthenticated(true); setSyncOn(true);
        setStage("onboarding");
        return;
      } catch (e) { return e.message || "Could not create the account."; }
    }
    await new Promise(r => setTimeout(r, 500));   // demo mode (no backend)
    setAuthUser({ email });
    setProfile(p => ({ ...p, name }));
    setIsAuthenticated(true);
    setStage("onboarding");
  };

  const requestLogout = () => setLogoutConfirmOpen(true);
  const confirmLogout = () => {
    setSyncOn(false); API.setToken(null);
    setIsAuthenticated(false);
    setLogoutConfirmOpen(false);
    setStage("landing");
    setView("dashboard");
  };

  const handleClearDemoData = () => {
    setGithubData(null); setResumeData(null); setAssessmentResults({}); setAssessmentHistory([]); setInterviewResult(null); setInterviewHistory([]); setCompletedProjects([]); setProjectState({});
  };

  const handleOnboardingComplete = () => {
    if (profile.githubUsername) setGithubData(analyzeGithub(profile.githubUsername, career.skills));
    if (profile.resumeText) setResumeData(analyzeResume(profile.resumeText, career));
    setStage("app");
    setView("dashboard");
  };

  if (stage === "landing") {
    return <Landing onGetStarted={handleGetStartedFromLanding} onLogin={() => setStage("login")} />;
  }

  if (stage === "login") {
    return <Login onLogin={handleLogin} onGoSignup={() => setStage("signup")} onBackHome={() => setStage("landing")} />;
  }

  if (stage === "signup") {
    return <Signup onSignup={handleSignup} onGoLogin={() => setStage("login")} onBackHome={() => setStage("landing")} />;
  }

  if (stage === "onboarding") {
    return <Onboarding profile={profile} setProfile={setProfile} onComplete={handleOnboardingComplete} />;
  }

  const assistantCtx = { career, skillState, nba, readiness, githubData, resumeData, subScores };

  return (
    <Shell view={view} setView={setView} profile={profile} readiness={Math.round(readiness)} onRequestLogout={requestLogout} notifications={notifications}>
      {view === "dashboard" && (
        <Dashboard profile={profile} career={career} skillState={skillState} subScores={subScores} readiness={Math.round(readiness)}
          nba={nba} setView={setView} githubData={githubData} resumeData={resumeData}
          hasAssessment={Object.keys(assessmentResults).length > 0} hasInterview={!!interviewAgg}
          hasProject={projectEvidence.verified.size > 0 || Object.values(projectState).some(e => e.status === "submitted" || e.status === "verified")} />
      )}
      {view === "twin" && (
        <DigitalTwin career={career} skillState={skillState} evidenceMap={evidenceMap} setView={setView} />
      )}
      {view === "career" && (
        <CareerSelectPage profile={profile} setProfile={setProfile} onChangeCareer={handleChangeCareer} skillState={skillState} readiness={Math.round(readiness)} setView={setView} />
      )}
      {view === "github" && (
        <GithubAnalyzer career={career} username={profile.githubUsername}
          setUsername={(u) => setProfile(p => ({ ...p, githubUsername: u }))}
          githubData={githubData} onAnalyze={handleGithubAnalyze} />
      )}
      {view === "resume" && (
        <ResumeIntel career={career} resumeText={profile.resumeText}
          setResumeText={(t) => setProfile(p => ({ ...p, resumeText: t }))}
          resumeData={resumeData} onAnalyze={handleResumeAnalyze} />
      )}
      {view === "job" && (
        <JobAnalyzer career={career} skillState={skillState} setView={setView} />
      )}
      {view === "assessment" && (
        <Assessment career={career} skillState={skillState} assessmentResults={assessmentResults} assessmentHistory={assessmentHistory} onAttemptComplete={handleAttemptComplete} />
      )}
      {view === "interview" && (
        <Interview profile={profile} career={career} githubData={githubData} resumeData={resumeData} history={interviewHistory} onComplete={handleInterviewComplete} lastResult={interviewResult?.scores} />
      )}
      {view === "projects" && (
        <Projects profile={profile} career={career} skillState={skillState} assessmentResults={assessmentResults} githubData={githubData} resumeData={resumeData} projectState={projectState} setProjectState={setProjectState} completedProjects={completedProjects} setView={setView} />
      )}
      {view === "roadmap" && (
        <Roadmap career={career} skillState={skillState} setView={setView} profile={profile} />
      )}
      {view === "progress" && (
        <Progress history={history} subScoreHistory={subScoreHistory} />
      )}
      {view === "report" && (
        <Report profile={profile} career={career} skillState={skillState} readiness={Math.round(readiness)} nba={nba} subScores={subScores} />
      )}
      {view === "profile" && (
        <ProfilePage profile={profile} setProfile={setProfile} career={career} authUser={authUser} completedProjects={completedProjects} projectState={projectState} />
      )}
      {view === "settings" && (
        <SettingsPage profile={profile} authUser={authUser} setView={setView} onRequestLogout={requestLogout} onClearData={handleClearDemoData} />
      )}
      <Assistant {...assistantCtx} />
      <LogoutConfirmModal open={logoutConfirmOpen} onCancel={() => setLogoutConfirmOpen(false)} onConfirm={confirmLogout} />
    </Shell>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

    (function () {
      function showBootError(title, detail) {
        var el = document.getElementById('boot-error');
        el.style.display = 'block';
        el.textContent = title + (detail ? ('\n\n' + detail) : '');
      }
      try {
        var src = document.getElementById('skillpilot-source').textContent;
        var compiled = Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]],
          filename: 'skillpilot.jsx',
        }).code;
        (0, eval)(compiled);
      } catch (err) {
        console.error(err);
        showBootError(
          'SkillPilot AI failed to start.',
          'This usually means a required CDN script (React / Tailwind / Babel / fonts) was blocked ' +
          'by your network, firewall, VPN, or an ad-blocker/extension, or there is no internet connection.\n\n' +
          'Try: a different network, disabling extensions, or an incognito window.\n\n' +
          'Technical detail: ' + (err && err.message ? err.message : err)
        );
      }
    })();
  </script>
