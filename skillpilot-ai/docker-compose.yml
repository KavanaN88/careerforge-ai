# One command: docker compose up --build
#   App + API : http://localhost:3000
#   pgAdmin   : http://localhost:5050   (login: admin@skillpilot.dev / admin)
#               add server → host "db", port 5432, user "skillpilot", password "skillpilot"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skillpilot
      POSTGRES_PASSWORD: skillpilot
      POSTGRES_DB: skillpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpilot"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://skillpilot:skillpilot@db:5432/skillpilot
      JWT_SECRET: change-this-long-random-secret-before-deploying
      ADMIN_EMAILS: ""   # comma-separated admin emails for assessment settings (empty = first registered account)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skillpilot.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
