// ---------- Primary-career panel: graph + readiness gap analysis + roadmap preview ----------
function CareerPlan({ career, skillState, readiness, profile, setView }) {
  const level = LEVEL_BY_ID[profile.careerLevel || defaultCareerLevel(profile.experience)];
  const buckets = { known: [], partial: [], improve: [], missing: [] };
  career.skills.forEach(s => { buckets[skillStatus(skillState[s.id]?.score ?? 0).id].push(s); });
  const statusOf = (s) => skillStatus(skillState[s.id]?.score ?? 0);
  const g = careerGraph(career);
  const phaseNames = ["Foundations", "Core skills", "Applied & advanced"];
  const phases = [0, 1, 2].map(i => {
    const skills = g.order.filter(s => (i < 2 ? g.depth[s.id] === i : g.depth[s.id] >= 2));
    return { name: phaseNames[i], skills, open: skills.filter(s => (skillState[s.id]?.score ?? 0) < level.target) };
  }).filter(p => p.skills.length);
  const capstone = projectsForCareer(career).find(p => p.careerId === career.id) || projectsForCareer(career)[0];
  const meta = [
    { id: "known", label: "Strong skills", tone: "good", hint: "Verified by evidence (70+)" },
    { id: "partial", label: "Partially known", tone: "warn", hint: "Some evidence (40–69)" },
    { id: "improve", label: "Needs improvement", tone: "cyan", hint: "Claimed or weak evidence" },
    { id: "missing", label: "Missing", tone: "bad", hint: "No skills or evidence yet" },
  ];
  return (
    <div className="space-y-6" data-testid="career-plan">
      <Card className="p-6">
        <div className="flex items-center gap-3 mb-1">
          <div className="w-10 h-10 rounded-xl bg-indigo/10 text-indigo flex items-center justify-center"><Icon name={career.icon} size={18} /></div>
          <div>
            <h3 className="font-display font-medium">{career.name} — skill dependency graph</h3>
            <p className="text-xs text-mute">Built from this role's required skills. Colour shows your current evidence.</p>
          </div>
        </div>
        <div className="mt-4">
          <GraphLegend items={[{ tone: "good", label: "Strong" }, { tone: "warn", label: "Partial" }, { tone: "cyan", label: "Needs evidence" }, { tone: "bad", label: "Missing" }]} />
          <SkillGraph career={career} statusOf={statusOf} />
        </div>
      </Card>

      <div className="grid lg:grid-cols-5 gap-6">
        <Card className="p-6 lg:col-span-2" data-testid="readiness-card">
          <h3 className="font-display font-medium mb-1">Career readiness</h3>
          <p className="text-xs text-mute mb-4">Based on verified evidence — resume, GitHub, projects, assessments and interviews — not on how many skills you ticked.</p>
          <div className="flex items-center gap-5">
            <ScoreRing score={readiness} label="Ready" />
            <div className="text-sm text-mute">
              <div>Target level: <span className="text-ink">{level.label}</span></div>
              <div className="text-xs mt-1">Skills count as complete at <span className="text-ink font-mono">{level.target}/100</span> confidence.</div>
            </div>
          </div>
          <div className="mt-5 space-y-2.5">
            {meta.map(m => (
              <div key={m.id} className="flex items-center justify-between text-sm" data-bucket={m.id}>
                <span className="inline-flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: TONE_HEX[m.tone] }} />{m.label}<span className="text-[11px] text-mute hidden sm:inline">· {m.hint}</span></span>
                <span className="font-mono">{buckets[m.id].length}</span>
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-6 lg:col-span-3" data-testid="gap-card">
          <h3 className="font-display font-medium mb-4">Skill gap analysis</h3>
          <div className="space-y-4">
            {meta.map(m => buckets[m.id].length > 0 && (
              <div key={m.id}>
                <div className="text-xs font-mono mb-1.5" style={{ color: TONE_HEX[m.tone] }}>{m.label.toUpperCase()} · {buckets[m.id].length}</div>
                <div className="flex flex-wrap gap-1.5">
                  {buckets[m.id].map(s => <span key={s.id} className="text-xs px-2.5 py-1 rounded-full border" style={{ borderColor: TONE_HEX[m.tone] + "66", background: TONE_HEX[m.tone] + "14" }}>{s.name} <span className="text-mute font-mono">{skillState[s.id]?.score ?? 0}</span></span>)}
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      <Card className="p-6" data-testid="roadmap-preview">
        <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
          <div>
            <h3 className="font-display font-medium">Your personalised roadmap</h3>
            <p className="text-xs text-mute">Phases follow the dependency graph; each skill is checked against your {level.label.toLowerCase()} target of {level.target}/100.</p>
          </div>
          <Button size="sm" onClick={() => setView("roadmap")} iconRight="arrow-right">Open full roadmap</Button>

        <div className="grid md:grid-cols-3 gap-4">

            <div key={p.name} className="glass rounded-xl p-4 border border-line">

              <div className="font-medium mb-1">{p.name}</div>
              <div className="text-xs text-mute mb-2">{p.open.length === 0 ? "All skills at target 🎉" : `${p.open.length} of ${p.skills.length} still to reach target`}</div>
              <div className="flex flex-wrap gap-1.5">{p.skills.map(s => <span key={s.id} className={`text-[11px] px-2 py-0.5 rounded-full ${p.open.includes(s) ? "bg-white/5 text-mute" : "bg-good/15 text-good"}`}>{s.name}</span>)}</div>
            </div>
          ))}
        </div>
        <div className="grid sm:grid-cols-2 gap-3 mt-4">
          <button onClick={() => setView("assessment")} className="text-left glass rounded-xl p-4 border border-line hover:border-cyan/40 transition-colors">
            <div className="text-xs font-mono text-indigo mb-1">ASSESSMENTS</div>
            <div className="text-sm">{buckets.missing.length + buckets.improve.length + buckets.partial.length} skills can be verified with a quick assessment →</div>
          </button>
          {capstone && (
            <button onClick={() => setView("projects")} className="text-left glass rounded-xl p-4 border border-line hover:border-cyan/40 transition-colors">
              <div className="text-xs font-mono text-indigo mb-1">PRACTICAL PROJECT</div>
              <div className="text-sm">{capstone.name}: {capstone.description}</div>
            </button>
          )}
        </div>
      </Card>
    </div>
  );
}

// ---------- Explorer page ----------
const PAGE_SIZE = 24;
const QUICK_FILTERS = [
  { id: "all", label: "All careers", icon: "grid" },
  { id: "popular", label: "Popular", icon: "star" },
  { id: "recommended", label: "Recommended for you", icon: "sparkles" },
  { id: "recent", label: "Recently viewed", icon: "history" },
  { id: "interests", label: "My interests", icon: "bookmark" },
];

function CareerSelectPage({ profile, setProfile, onChangeCareer, skillState, readiness, setView }) {
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("all");
  const [category, setCategory] = useState("all");
  const [limit, setLimit] = useState(PAGE_SIZE);
  const current = CAREER_BY_ID[profile.careerId];
  const [open, setOpen] = useState(() => { const o = {}; o[current ? current.category : "software"] = true; return o; });
  const [detailId, setDetailId] = useState(null);

  const secondary = profile.secondaryCareers || [];
  const recentIds = profile.recentCareers || [];
  const levelId = profile.careerLevel || defaultCareerLevel(profile.experience);
  const ctx = useMemo(() => claimContext(profile.currentSkills), [profile.currentSkills]);
  const recs = useMemo(() => recommendCareers(ctx, 6, [profile.careerId]), [ctx, profile.careerId]);
  const matchOf = (c) => roleMatch(c, ctx);

  const openDetails = (id) => {
    setDetailId(id);
    setProfile(p => ({ ...p, recentCareers: [id, ...(p.recentCareers || []).filter(x => x !== id)].slice(0, 8) }));
  };
  const toggleSecondary = (id) => setProfile(p => {
    const list = p.secondaryCareers || [];
    if (id === p.careerId) return p;
    return { ...p, secondaryCareers: list.includes(id) ? list.filter(x => x !== id) : [...list, id].slice(0, 5) };
  });
  const select = (id) => {
    onChangeCareer(id);
    setProfile(p => ({ ...p, secondaryCareers: (p.secondaryCareers || []).filter(x => x !== id) }));
  };
  const setLevel = (id) => setProfile(p => ({ ...p, careerLevel: id }));

  const searching = query.trim() !== "" || filter !== "all" || category !== "all";
  const results = useMemo(() => {
    let ids;
    if (filter === "recent") ids = recentIds;
    else if (filter === "interests") ids = secondary;
    let list = searchCareers(query, { category, ids });
    if (filter === "popular") list = list.filter(r => r.career.popular);
    if (filter === "recommended") {
      const rank = {}; recommendCareers(ctx, 200).forEach((r, i) => { rank[r.career.id] = i; });
      list = list.filter(r => rank[r.career.id] !== undefined);
      if (!query.trim()) list = list.sort((a, b) => rank[a.career.id] - rank[b.career.id]);
    }
    if (filter === "recent" && !query.trim()) list = list.sort((a, b) => recentIds.indexOf(a.career.id) - recentIds.indexOf(b.career.id));
    return list.map(r => r.career);
  }, [query, filter, category, recentIds.join(), secondary.join(), ctx]);

  const reset = () => { setQuery(""); setFilter("all"); setCategory("all"); setLimit(PAGE_SIZE); };
  const card = (c, m) => <CareerCard key={c.id} career={c} isPrimary={c.id === profile.careerId} isSecondary={secondary.includes(c.id)} match={m ?? matchOf(c)} onView={openDetails} onSelect={select} />;
  const detail = detailId ? CAREER_BY_ID[detailId] : null;
  const allOpen = CAREER_CATEGORIES.every(c => open[c.id]);

  return (
    <div className="max-w-6xl mx-auto px-6 py-10">
      <SectionTitle eyebrow="Target career" title="Explore technology careers"
        sub={`Browse ${CAREERS.length} roles across ${CAREER_CATEGORIES.length} categories. Your Career Digital Twin, roadmap and assessments are built around the career you select — change it any time.`} />

      {/* Current selection */}
      {current ? (
        <Card className="p-5 mb-6" glow data-testid="selection-card">
          <div className="flex items-start gap-4 flex-wrap">
            <div className="w-12 h-12 rounded-xl bg-cyan/10 text-cyan flex items-center justify-center shrink-0"><Icon name={current.icon} size={22} /></div>
            <div className="flex-1 min-w-[220px]">
              <div className="text-xs font-mono text-cyan mb-0.5">PRIMARY TARGET CAREER</div>
              <div className="font-display text-lg font-semibold">{current.name}</div>
              <div className="text-xs text-mute">{categoryOf(current)?.name} · {current.skills.length} core skills</div>
            </div>
            <div>
              <div className="text-xs text-mute mb-1.5">Career level you're aiming for</div>
              <div className="flex flex-wrap gap-1.5" role="radiogroup" aria-label="Career level">
                {ROLE_LEVELS.map(l => (
                  <button key={l.id} role="radio" aria-checked={levelId === l.id} onClick={() => setLevel(l.id)} data-level={l.id} title={`${l.desc} (${l.years})`}
                    className={`chip px-3 py-1.5 rounded-full text-sm transition-colors ${levelId === l.id ? "!bg-indigo/20 !border-indigo/60 text-white" : "text-mute hover:text-ink"}`}>{l.label}</button>
                ))}
              </div>
            </div>
          </div>
          <div className="mt-4 pt-4 border-t border-line">
            <div className="text-xs text-mute mb-2">Secondary interests {secondary.length ? `· ${secondary.length}/5` : ""}</div>
            {secondary.length === 0 ? (
              <p className="text-xs text-mute">None yet — open any career and choose “Add as secondary interest” to keep related options (e.g. SRE or Platform Engineer for a Cloud Engineer).</p>
            ) : (
              <div className="flex flex-wrap gap-2" data-testid="secondary-list">
                {secondary.map(id => CAREER_BY_ID[id] && (
                  <span key={id} className="skill-pop inline-flex items-center gap-1 pl-3 pr-1.5 py-1 rounded-full text-sm bg-indigo/20 border border-indigo/50">
                    <button onClick={() => openDetails(id)} className="hover:underline">{CAREER_BY_ID[id].name}</button>
                    <button onClick={() => toggleSecondary(id)} aria-label={`Remove ${CAREER_BY_ID[id].name}`} data-remove-secondary={id} className="w-5 h-5 rounded-full inline-flex items-center justify-center text-mute hover:text-white hover:bg-white/10"><Icon name="x" size={12} strokeWidth={2.5} /></button>
                  </span>
                ))}
              </div>
            )}
          </div>
        </Card>
      ) : (
        <Card className="p-5 mb-6 !bg-indigo/5 border-indigo/25 text-sm text-mute">No career selected yet — pick one below to generate your skill graph, readiness score and roadmap.</Card>
      )}

      {current && <div className="mb-10"><CareerPlan career={current} skillState={skillState} readiness={readiness} profile={profile} setView={setView} /></div>}

      {/* Search + filters */}
      <div className="sticky top-0 z-20 -mx-2 px-2 py-3 mb-4 bg-navy/90 backdrop-blur">
        <div className="relative">
          <Icon name="search" size={16} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-mute" />
          <input value={query} onChange={e => { setQuery(e.target.value); setLimit(PAGE_SIZE); }} aria-label="Search careers" data-testid="career-search"
            placeholder="Search from hundreds of technology career roles..."
            className="w-full bg-panel2 border border-line rounded-xl pl-10 pr-10 py-3 text-sm text-ink placeholder:text-mute/60 focus:border-indigo/60 transition-colors" />
          {query && <button onClick={() => setQuery("")} aria-label="Clear search" className="absolute right-3 top-1/2 -translate-y-1/2 text-mute hover:text-ink"><Icon name="x" size={15} /></button>}
        </div>
        <div className="flex flex-wrap items-center gap-2 mt-3">
          {QUICK_FILTERS.map(f => (
            <button key={f.id} onClick={() => { setFilter(f.id); setLimit(PAGE_SIZE); }} data-filter={f.id} aria-pressed={filter === f.id}
              className={`chip inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm transition-colors ${filter === f.id ? "!bg-indigo/20 !border-indigo/60 text-white" : "text-mute hover:text-ink"}`}>
              <Icon name={f.icon} size={13} />{f.label}
            </button>
          ))}
          <select value={category} onChange={e => { setCategory(e.target.value); setLimit(PAGE_SIZE); }} aria-label="Filter by category" data-testid="category-filter"
            className="ml-auto bg-panel2 border border-line rounded-xl px-3 py-1.5 text-sm text-ink">
            <option value="all">All categories</option>
            {CAREER_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
      </div>

      {searching ? (
        <div data-testid="career-results">
          <div className="flex items-center justify-between mb-4 text-sm text-mute">
            <span><span className="text-ink font-mono">{results.length}</span> career{results.length === 1 ? "" : "s"} found{query.trim() ? <> for “{query.trim()}”</> : null}</span>
            <button onClick={reset} className="text-cyan hover:underline">Clear filters</button>
          </div>
          {results.length === 0 ? (
            <EmptyState icon="search" title="No careers match" sub={filter === "recent" ? "Open any career's details and it will appear here." : filter === "interests" ? "Add secondary interests from a career's details." : "Try a different title, technology or category."} />
          ) : (
            <>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{results.slice(0, limit).map(c => card(c))}</div>
              {results.length > limit && <div className="text-center mt-6"><Button variant="secondary" onClick={() => setLimit(l => l + PAGE_SIZE)}>Show more ({results.length - limit} left)</Button></div>}
            </>
          )}
        </div>
      ) : (
        <div className="space-y-10">
          {recs.length > 0 && (
            <section data-testid="recommended">
              <h3 className="font-display font-medium mb-1 flex items-center gap-2"><Icon name="sparkles" size={16} className="text-cyan" />{Object.keys(ctx.selIds).length ? "Recommended for you" : "Popular careers"}</h3>
              <p className="text-xs text-mute mb-4">{Object.keys(ctx.selIds).length ? "Ranked by how many core skills you already listed in onboarding." : "Add skills in your profile to get personalised recommendations."}</p>
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{recs.map(r => card(r.career, r.match))}</div>
            </section>
          )}
          {recentIds.filter(id => CAREER_BY_ID[id]).length > 0 && (
            <section data-testid="recent">
              <h3 className="font-display font-medium mb-4 flex items-center gap-2"><Icon name="history" size={16} className="text-cyan" />Recently viewed</h3>
              <div className="flex flex-wrap gap-2">
                {recentIds.filter(id => CAREER_BY_ID[id]).slice(0, 6).map(id => <button key={id} onClick={() => openDetails(id)} className="chip px-3 py-1.5 rounded-full text-sm hover:border-cyan/50 transition-colors">{CAREER_BY_ID[id].name}</button>)}
              </div>
            </section>
          )}
          <section>
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-display font-medium">Browse by category</h3>
              <button className="text-sm text-cyan hover:underline" onClick={() => { const o = {}; if (!allOpen) CAREER_CATEGORIES.forEach(c => { o[c.id] = true; }); setOpen(o); }}>{allOpen ? "Collapse all" : "Expand all"}</button>
            </div>
            <div className="space-y-3">
              {CAREER_CATEGORIES.map(cat => {
                const list = CAREERS.filter(c => c.category === cat.id);
                const isOpen = !!open[cat.id];
                return (
                  <div key={cat.id} className={`glass rounded-2xl border transition-colors ${isOpen ? "border-indigo/30" : "border-line"}`}>
                    <button type="button" aria-expanded={isOpen} data-career-cat={cat.id} onClick={() => setOpen(o => ({ ...o, [cat.id]: !o[cat.id] }))}
                      className="w-full flex items-center gap-3 px-4 py-3 text-left">
                      <span className="w-9 h-9 rounded-lg bg-indigo/15 text-indigo inline-flex items-center justify-center shrink-0"><Icon name={cat.icon} size={17} /></span>
                      <span className="min-w-0 flex-1">
                        <span className="block font-display font-medium truncate">{cat.name}</span>
                        <span className="block text-xs text-mute truncate">{cat.blurb}</span>
                      </span>
                      <span className="text-xs font-mono px-2 py-0.5 rounded-full bg-white/5 text-mute shrink-0">{list.length}</span>
                      <Icon name="chevron-down" size={16} className={`text-mute shrink-0 transition-transform ${isOpen ? "rotate-180" : ""}`} />
                    </button>
                    {isOpen && (
                      <div className="px-4 pb-4">
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{list.map(c => card(c))}</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </section>
        </div>
      )}

      <Modal open={!!detail} onClose={() => setDetailId(null)} wide>
        {detail && <CareerDetails career={detail} ctx={ctx} profile={profile}
          isPrimary={detail.id === profile.careerId} isSecondary={secondary.includes(detail.id)}
          onSelect={select} onToggleSecondary={toggleSecondary} onOpen={openDetails} onClose={() => setDetailId(null)} />}
      </Modal>
    </div>
  );
}

      </div>
      <select value={category} onChange={e => { setCategory(e.target.value); setLimit(12); }} aria-label="Filter by category"
        className="w-full bg-panel2 border border-line rounded-xl px-3 py-2 text-sm text-ink mb-4">
        <option value="all">All categories ({CAREERS.length} careers)</option>
        {CAREER_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
      {results.length === 0 && <p className="text-sm text-mute py-6 text-center">No careers match “{query}”.</p>}
      <div className="grid sm:grid-cols-2 gap-3">
        {results.slice(0, limit).map(c => (
          <button key={c.id} type="button" onClick={() => onSelect(c.id)} data-career-card={c.id}
            className={`text-left p-4 rounded-xl border glass transition-all hover:border-cyan/50 ${selectedId === c.id ? "border-cyan shadow-cyanglow" : "border-line"}`}>
            <div className="flex items-center gap-2.5 mb-1.5">
              <span className="w-8 h-8 rounded-lg bg-cyan/10 text-cyan flex items-center justify-center shrink-0"><Icon name={c.icon} size={15} /></span>
              <span className="font-medium text-sm leading-tight">{c.name}</span>
            </div>
            <div className="text-[11px] text-cyan/80 font-mono mb-1">{categoryOf(c)?.name}</div>
            <p className="text-xs text-mute line-clamp-2">{c.description}</p>
          </button>
        ))}
      </div>
      {results.length > limit && <div className="text-center mt-4"><Button size="sm" variant="secondary" onClick={() => setLimit(l => l + 12)}>Show more ({results.length - limit})</Button></div>}
    </div>
  );
}

// ==== src/components/Dashboard.js ====
function SubScoreCard({ icon, label, score, onClick, note, hasData = true, emptyLabel }) {
  return (
    <Card className="p-5 cursor-pointer hover:border-indigo/40 transition-colors" onClick={onClick}>
      <div className="flex items-center justify-between mb-4">
        <div className="w-9 h-9 rounded-lg bg-indigo/10 text-indigo flex items-center justify-center"><Icon name={icon} size={17} /></div>
        {hasData ? (
          <span className={`font-mono text-lg font-semibold ${score >= 75 ? "text-good" : score >= 45 ? "text-warn" : "text-bad"}`}>{Math.round(score)}</span>
        ) : (
          <Badge tone="mute">Not yet</Badge>
        )}
      </div>
      <div className="text-sm text-ink/90 mb-1">{label}</div>
      {hasData ? <ScoreBar score={score} showValue={false} size="sm" /> : <div className="w-full h-1.5 rounded-full bg-white/5 border border-dashed border-line" />}
      <div className="text-xs text-mute mt-2">{hasData ? note : emptyLabel}</div>
    </Card>
  );
}

function TwinCompletion({ profile, githubData, resumeData, hasAssessment, hasProject, setView }) {
  const items = [
    { label: "Basic profile", done: !!profile.name, action: null },
    { label: "Target career", done: !!profile.careerId, action: null },
    { label: "Skills", done: profile.currentSkills.length > 0, action: null },
    { label: "Connect GitHub", done: !!githubData, action: () => setView("github") },
    { label: "Upload resume", done: !!resumeData, action: () => setView("resume") },
    { label: "Take assessment", done: hasAssessment, action: () => setView("assessment") },
    { label: "Add project", done: hasProject, action: () => setView("projects") },
  ];
  const doneCount = items.filter(i => i.done).length;
  const pct = Math.round((doneCount / items.length) * 100);
  const nextTodo = items.find(i => !i.done);

  if (pct === 100) return null;

  return (
    <Card className="p-6 mb-8">
      <div className="flex items-center justify-between flex-wrap gap-4 mb-4">
        <div>
          <div className="text-xs font-mono uppercase tracking-widest text-mute mb-1">Career Twin Completion</div>
          <div className="font-display text-2xl font-semibold">{pct}%</div>
        </div>
        {nextTodo && (
          <Button size="sm" onClick={nextTodo.action}>Complete Career Twin <Icon name="arrow-right" size={14} /></Button>
        )}
      </div>
      <ScoreBar score={pct} showValue={false} />
      <div className="flex flex-wrap gap-x-5 gap-y-2 mt-4">
        {items.map(i => (
          <button key={i.label} onClick={i.action || undefined} disabled={!i.action || i.done}
            className={`flex items-center gap-1.5 text-xs ${i.done ? "text-good" : "text-mute hover:text-ink"} ${i.action && !i.done ? "cursor-pointer" : "cursor-default"}`}>
            <Icon name={i.done ? "check" : "clock"} size={13} />
            {i.label}
          </button>
        ))}
      </div>
    </Card>
  );
}

function ReadinessWhyModal({ open, onClose, subScores, readiness }) {
  const rows = readinessBreakdown(subScores);
  return (
    <Modal open={open} onClose={onClose}>
      <div className="p-6 md:p-7">
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-display text-lg font-medium">Why {readiness}/100?</h3>
          <button onClick={onClose} className="text-mute hover:text-ink p-1"><Icon name="x" size={18} /></button>
        </div>
        <div className="space-y-2.5 mb-4">
          {rows.map(r => (
            <div key={r.key} className="flex items-center justify-between text-sm py-1.5 border-b border-line last:border-0">
              <div>
                <span className="text-ink/90">{r.label}</span>
                <span className="text-mute text-xs ml-2">({r.weightPct}% weight · raw {r.rawScore}/100)</span>
              </div>
              <span className="font-mono text-cyan">+{r.points}</span>
            </div>
          ))}
        </div>
        <div className="flex items-center justify-between pt-3 border-t border-line">
          <span className="font-medium">Total</span>
          <span className="font-mono text-lg font-semibold text-gradient">{readiness}/100</span>
        </div>
        <p className="text-xs text-mute mt-4">Career Readiness is a transparent, weighted rollup — never a black-box AI guess. Weights are configurable per career in production.</p>
      </div>
    </Modal>
  );
}

function skillLevel(skill, career, memo = {}) {
  if (memo[skill.id] !== undefined) return memo[skill.id];
  if (!skill.deps.length) { memo[skill.id] = 0; return 0; }
  const depLevels = skill.deps.map(depId => {
    const dep = career.skills.find(s => s.id === depId);
    return dep ? skillLevel(dep, career, memo) : 0;
  });
  const lvl = Math.max(...depLevels) + 1;
  memo[skill.id] = lvl;
  return lvl;
}

function SkillNode({ skill, score, onClick }) {
  const tone = score >= 75 ? "good" : score >= 45 ? "warn" : "bad";
  const toneClasses = { good: "border-good/40 text-good", warn: "border-warn/40 text-warn", bad: "border-bad/40 text-bad" };
  return (
    <button onClick={onClick}
      className={`group w-full glass rounded-xl p-3.5 text-left border hover:shadow-glow transition-all ${toneClasses[tone]}`}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-sm font-medium text-ink">{skill.name}</span>
        <span className="font-mono text-xs font-semibold">{score}</span>
      </div>
      <ScoreBar score={score} showValue={false} size="sm" />
      {skill.deps.length > 0 && (
        <div className="text-[10px] text-mute mt-2 truncate">builds on {skill.deps.length} skill{skill.deps.length > 1 ? "s" : ""}</div>
      )}
    </button>
  );
}

function DigitalTwin({ career, skillState, evidenceMap, setView }) {
  const [openSkillId, setOpenSkillId] = useState(null);
  const memo = {};
  const levels = {};
  career.skills.forEach(s => {
    const lvl = skillLevel(s, career, memo);
    levels[lvl] = levels[lvl] || [];
    levels[lvl].push(s);
  });
  const levelKeys = Object.keys(levels).map(Number).sort((a, b) => a - b);
  const openSkill = career.skills.find(s => s.id === openSkillId);

  return (
    <div className="max-w-6xl mx-auto px-6 py-8 md:py-10">
      <SectionTitle eyebrow="Career Digital Twin" title={`${career.name} skill graph`}
        sub="Click any skill to see exactly why it's scored the way it is, and what would move it." />

      <div className="flex gap-4 overflow-x-auto pb-4">
        {levelKeys.map(lvl => (
          <div key={lvl} className="flex flex-col gap-3 min-w-[220px] flex-1">
            <div className="text-[11px] font-mono text-mute uppercase tracking-wider px-1">
              {lvl === 0 ? "Foundation" : `Depth ${lvl}`}
            </div>
            {levels[lvl].map(skill => (
              <SkillNode key={skill.id} skill={skill} score={skillState[skill.id]?.score ?? 0} onClick={() => setOpenSkillId(skill.id)} />
            ))}
          </div>
        ))}
      </div>

      <Card className="p-6 mt-8">
        <h3 className="font-display font-medium mb-4">Twin summary</h3>
        <div className="grid sm:grid-cols-3 gap-4 text-sm">
          <div>
            <div className="text-mute text-xs mb-1">Strongest skill</div>
            <div className="font-medium">{[...career.skills].sort((a, b) => (skillState[b.id]?.score ?? 0) - (skillState[a.id]?.score ?? 0))[0]?.name}</div>
          </div>
          <div>
            <div className="text-mute text-xs mb-1">Weakest skill</div>
            <div className="font-medium">{[...career.skills].sort((a, b) => (skillState[a.id]?.score ?? 0) - (skillState[b.id]?.score ?? 0))[0]?.name}</div>
          </div>
          <div>
            <div className="text-mute text-xs mb-1">Skills with strong evidence (≥75)</div>
            <div className="font-medium">{career.skills.filter(s => (skillState[s.id]?.score ?? 0) >= 75).length} / {career.skills.length}</div>
          </div>
        </div>
      </Card>

      {openSkill && (
        <SkillDetailModal
          skill={openSkill}
          career={career}
          evidence={evidenceMap[openSkill.id] || {}}
          score={skillState[openSkill.id]?.score ?? 0}
          breakdown={skillState[openSkill.id]?.breakdown ?? []}
          onClose={() => setOpenSkillId(null)}
          onGoAssess={() => { setOpenSkillId(null); setView("assessment"); }}
          onGoProjects={() => { setOpenSkillId(null); setView("projects"); }}
        />
      )}
    </div>
  );
}

    setTimeout(() => {
      setResult(analyzeJobDescription(jdText, career, skillState));
      setLoading(false);
    }, 800);
  };

  const StatusBadge = ({ status }) => {
    const map = { strong: ["good", "✓"], partial: ["warn", "⚠"], missing: ["bad", "✗"] };
    const [tone, mark] = map[status];
    return <Badge tone={tone}>{mark}</Badge>;
  };

  return (
    <div className="max-w-5xl mx-auto px-6 py-8 md:py-10">
      <SectionTitle eyebrow="Job Matcher" title="How well do you match a real job posting?"
        sub="Paste a job description. SkillPilot extracts required and preferred skills and compares them to your Career Digital Twin." />

      <Card className="p-6 mb-8">
        <Field label="Job description">
          <textarea className={inputCls + " min-h-[180px] resize-y"} value={jdText} onChange={e => setJdText(e.target.value)}
            placeholder="Paste the full job description here..." />
        </Field>
        <Button onClick={run} disabled={loading || !jdText.trim()} icon={loading ? undefined : "search"}>
          {loading ? <><Spinner size={15} /> Matching…</> : "Analyze Match"}
        </Button>
      </Card>

      {!result && !loading && (
        <EmptyState icon="briefcase" title="No job pasted yet" sub="Paste a job description above to see your fit, skill by skill." />
      )}

      {result && (
        <div className="fade-up space-y-6">
          <Card className="p-6" glow>
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div>
                <h3 className="font-display text-lg font-medium">Job Match</h3>
                <p className="text-xs text-mute mt-1">{result.strong.length} strong · {result.partial.length} partial · {result.missing.length} missing</p>
              </div>
              <span className="font-mono text-3xl font-semibold text-gradient">{result.matchPct}%</span>
            </div>
          </Card>

          {result.missing.length > 0 && (() => {
            const blocker = [...result.missing].sort((a, b) => b.skill.weight - a.skill.weight)[0];
            return (
              <Card className="p-5 !bg-bad/5 border-bad/25 flex items-center justify-between flex-wrap gap-4">
                <div>
                  <div className="text-xs font-mono uppercase tracking-widest text-bad mb-1">Biggest blocker</div>
                  <div className="font-display font-medium text-lg">{blocker.skill.name}</div>
                </div>
                <Button size="sm" variant="secondary" onClick={() => setView("projects")} icon="layers">Find a proof challenge</Button>
              </Card>
            );
          })()}

          <Card className="p-6">
            <h4 className="text-xs font-mono uppercase tracking-wider text-mute mb-4">Skill-by-skill breakdown</h4>
            <div className="space-y-2.5">
              {[...result.strong, ...result.partial, ...result.missing].map(({ skill, status }) => (
                <div key={skill.id} className="flex items-center justify-between py-2 border-b border-line last:border-0">
                  <span className="text-sm">{skill.name}</span>
                  <div className="flex items-center gap-3">
                    <span className="font-mono text-xs text-mute">{skillState[skill.id]?.score ?? 0}/100</span>
                    <StatusBadge status={status} />
                  </div>
                </div>
              ))}
            </div>
          </Card>

          <Card className="p-6 !bg-cyan/5 border-cyan/25">
            <div className="flex items-center gap-2 mb-2 text-cyan text-sm font-medium"><Icon name="sparkles" size={15} /> Why this match is {result.matchPct >= 70 ? "strong" : result.matchPct >= 40 ? "moderate" : "low"}</div>
            <p className="text-sm text-mute">
              {result.missing.length > 0
                ? `You're missing solid evidence for ${result.missing.slice(0, 3).map(m => m.skill.name).join(", ")}. These carry real weight in this posting — closing them would meaningfully raise your match.`
                : "You have at least partial evidence for every skill this posting asks for. Focus on turning partial matches into strong ones."}
            </p>
          </Card>
        </div>
      )}
    </div>
  );
}

// ==== src/components/Assessment.js ====
// ============================================================================
// AI ASSESSMENT — dynamic, career-based, 3 levels for every skill.
// Props: career, skillState, assessmentResults (0-10 legacy map), assessmentHistory[],
//        onAttemptComplete({ entry, score10, serverState })
// Components: CareerAssessmentOverview, DifficultySelector, SkillAssessmentCard, AssessmentInstructions,
// AssessmentTimer, QuestionRenderer, AssessmentNavigation, AssessmentResults, PerformanceAnalytics,
// AssessmentHistory, AssessmentSettings. Backend mode grades on the server; demo mode grades locally.
// ============================================================================
const LEVEL_STYLE = {
  basic:        { text: "text-good",   border: "border-good/40",   bg: "bg-good/10",   ring: "border-good",   dot: "bg-good",   bar: "#22C55E", tone: "good" },
  intermediate: { text: "text-indigo", border: "border-indigo/40", bg: "bg-indigo/10", ring: "border-indigo", dot: "bg-indigo", bar: "#6366F1", tone: "indigo" },
  advanced:     { text: "text-warn",   border: "border-warn/40",   bg: "bg-warn/10",   ring: "border-warn",   dot: "bg-warn",   bar: "#F59E0B", tone: "warn" },
};
const LEVEL_BY_KEY = {}; ASSESSMENT_LEVELS.forEach(l => { LEVEL_BY_KEY[l.id] = l; });
const DRAFT_KEY = "skillpilot:assessmentDraft";
const CONFIG_KEY = "skillpilot:assessmentConfig";
const fmtClock = (sec) => { sec = Math.max(0, Math.round(sec)); return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; };
const useBackendAssess = () => !!(API.available && API.token);
const loadDraft = () => { try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); return d && d.deadline > Date.now() ? d : null; } catch (e) { return null; } };
const saveDraft = (d) => { try { d ? localStorage.setItem(DRAFT_KEY, JSON.stringify(d)) : localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ } };
const pctTone = (p) => (p >= 75 ? "good" : p >= 50 ? "warn" : "bad");

function Assessment({ career, skillState, assessmentResults, assessmentHistory, onAttemptComplete }) {
  const history = assessmentHistory || [];
  const [config, setConfig] = useState(() => { try { return normalizeAssessmentConfig(JSON.parse(localStorage.getItem(CONFIG_KEY) || "null")); } catch (e) { return defaultAssessmentConfig(); } });
  const [isAdmin, setIsAdmin] = useState(() => !useBackendAssess());   // demo mode: you own the settings
  const [focusLevel, setFocusLevel] = useState("basic");
  const [phase, setPhase] = useState("home");                           // home | instructions | run | results
  const [target, setTarget] = useState(null);                           // { skillId, level }
  const [session, setSession] = useState(null);
  const [answers, setAnswers] = useState({});
  const [idx, setIdx] = useState(0);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [draft, setDraft] = useState(() => loadDraft());
  const [query, setQuery] = useState("");
  const submitting = useRef(false);

  // Server-side configuration (backend mode)
  useEffect(() => {
    if (!useBackendAssess()) return;
    API.request("GET", "/api/assessment/config").then(r => { setConfig(normalizeAssessmentConfig(r.config)); setIsAdmin(!!r.isAdmin); }).catch(() => {});
  }, []);

  const skillObj = (id) => career.skills.find(s => s.id === id);
  const recs = useMemo(() => recommendNext(career, history, skillState, config), [career, history, skillState, config]);
  const summaries = useMemo(() => { const m = {}; career.skills.forEach(s => { m[s.id] = skillLevelSummary(history, s.id); }); return m; }, [career, history]);
  const composites = useMemo(() => { const m = {}; career.skills.forEach(s => { m[s.id] = skillComposite(history, s.id); }); return m; }, [career, history]);

  // ---- lifecycle ----
  const openInstructions = (skillId, level) => { setError(""); setTarget({ skillId, level }); setPhase("instructions"); window.scrollTo && window.scrollTo(0, 0); };

  const begin = async () => {
    setBusy(true); setError("");
    const { skillId, level } = target;
    try {
      let sess;
      if (useBackendAssess()) {
        const r = await API.request("POST", "/api/assessment/start", { skillId, level, careerId: career.id });
        sess = { attemptId: r.attemptId, skillId, level, questions: r.questions, limitSec: r.limitSec, settings: r.settings, deadline: Date.now() + r.remainingSec * 1000, server: true, startedAt: Date.now() - (r.limitSec - r.remainingSec) * 1000 };
        setAnswers(r.answers || {});
      } else {
        const exclude = history.filter(h => h.skillId === skillId && h.level === level).slice(-3).flatMap(h => h.questionIds || []);
        const qs = buildAssessment(skillId, level, config, { seed: `${skillId}:${level}:${Date.now()}:${Math.random()}`, exclude });
        if (!qs.length) throw new Error("No questions are available for this skill with the current format settings.");
        const lc = normalizeAssessmentConfig(config).levels[level];
        sess = { attemptId: null, skillId, level, questions: qs, limitSec: lc.minutes * 60, settings: lc, deadline: Date.now() + lc.minutes * 60000, server: false, startedAt: Date.now() };
        setAnswers({});
      }
      setSession(sess); setIdx(0); setResult(null); setPhase("run");
      saveDraft({ ...sess, answers: {}, idx: 0 });
    } catch (e) { setError(e.message || "Could not start the assessment."); }
    setBusy(false);
  };

  const resumeDraft = () => {
    if (!draft) return;
    const { answers: a, idx: i, ...sess } = draft;
    setTarget({ skillId: sess.skillId, level: sess.level }); setSession(sess); setAnswers(a || {}); setIdx(i || 0); setResult(null); setPhase("run"); setDraft(null);
  };
  const discardDraft = () => { saveDraft(null); setDraft(null); };

  // Persist answers instantly to local draft; debounce autosave to the server.
  const saveTimer = useRef(null);
  const setAnswer = (qid, value) => {
    setAnswers(prev => {
      const next = { ...prev };
      if (value === null || (Array.isArray(value) && !value.length)) delete next[qid]; else next[qid] = value;
      saveDraft({ ...session, answers: next, idx });
      if (session && session.server) {
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => API.request("PUT", `/api/assessment/${session.attemptId}/answers`, { answers: next }).catch(() => {}), 700);
      }
      return next;
    });
  };
  const goTo = (i) => { setIdx(i); if (session) saveDraft({ ...session, answers, idx: i }); };

  const submit = async (auto) => {
    if (submitting.current || !session) return;
    submitting.current = true; setBusy(true); setError("");
    const elapsed = Math.min(session.limitSec, Math.round((Date.now() - session.startedAt) / 1000));
    try {
      let res, entry, score10, serverState = null;
      if (session.server) {
        clearTimeout(saveTimer.current);
        const r = await API.request("POST", `/api/assessment/${session.attemptId}/submit`, { answers, elapsedSec: elapsed });
        res = r.result; entry = r.entry; score10 = r.score10; serverState = { assessmentResults: r.assessmentResults, assessmentHistory: r.assessmentHistory };
        if (!entry) { entry = historyEntry({ id: "srv-" + r.attemptId, skillId: session.skillId, careerId: career.id, level: session.level, limitSec: session.limitSec }, res); }
      } else {
        res = gradeAssessment(session.questions, answers, { passPct: session.settings.passPct, elapsedSec: elapsed });
        entry = historyEntry({ id: "loc-" + Date.now(), skillId: session.skillId, careerId: career.id, level: session.level, limitSec: session.limitSec }, res);
        score10 = compositeToTen(skillComposite([...history, entry], session.skillId));
      }
      const prev = history.filter(h => h.skillId === session.skillId && h.level === session.level).slice(-1)[0] || null;
      saveDraft(null);
      setResult({ ...res, entry, prev, auto: !!auto, skillId: session.skillId, level: session.level, composite: skillComposite([...history, entry].filter((h, i, a) => a.findIndex(x => x.id === h.id) === i), session.skillId) });
      onAttemptComplete({ entry, score10, serverState });
      setPhase("results"); window.scrollTo && window.scrollTo(0, 0);
    } catch (e) { setError(e.message || "Could not submit. Your answers are saved — try again."); }
    submitting.current = false; setBusy(false);
  };

  const backHome = () => { setPhase("home"); setSession(null); setResult(null); setTarget(null); setError(""); setDraft(loadDraft()); };

  // ---- phases ----
  if (phase === "instructions" && target) {
    return <AssessmentInstructions skill={skillObj(target.skillId)} level={target.level} config={config} busy={busy} error={error} onStart={begin} onBack={backHome}
      summary={(summaries[target.skillId] || {})[target.level]} />;
  }
  if (phase === "run" && session) {
    return <AssessmentRunner session={session} skill={skillObj(session.skillId)} answers={answers} idx={idx} busy={busy} error={error}
      onAnswer={setAnswer} onGo={goTo} onSubmit={submit} onExit={backHome} />;
  }
  if (phase === "results" && result) {
    const nextRecs = recommendNext(career, [...history], skillState, config).filter(r => r.skillId !== result.skillId || r.level !== result.level);
    return <AssessmentResults result={result} skill={skillObj(result.skillId)} recs={nextRecs.slice(0, 3)} history={history}
      onRetake={() => openInstructions(result.skillId, result.level)} onStart={openInstructions} onBack={backHome} />;
  }

  const q = query.trim().toLowerCase();
  const skills = career.skills.filter(s => !q || s.name.toLowerCase().includes(q));
  const verified = career.skills.filter(s => (composites[s.id] || 0) > 0).length;
  const avg = career.skills.length ? Math.round(career.skills.reduce((t, s) => t + (composites[s.id] || 0), 0) / career.skills.length) : 0;
  const topRec = recs[0];

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8 md:py-10" data-testid="assessment-home">
      <SectionTitle eyebrow="AI Technical Assessment" title="Prove each skill at three levels"
        sub="Every skill in your target career can be assessed at Basic, Intermediate and Advanced level. Results become verified evidence in your Career Digital Twin."
        right={<Button variant="secondary" size="sm" icon="filter" onClick={() => setShowSettings(true)} data-testid="open-settings">Assessment settings</Button>} />

      {draft && (
        <Card className="p-4 mb-5 !bg-warn/5 border-warn/30 flex flex-wrap items-center gap-3" data-testid="resume-banner">
          <Icon name="clock" size={16} className="text-warn" />
          <span className="text-sm flex-1 min-w-[200px]">You have an unfinished <b>{LEVEL_BY_KEY[draft.level].label}</b> assessment on <b>{(SKILL_LIB[draft.skillId] || {}).name}</b> — {fmtClock((draft.deadline - Date.now()) / 1000)} left. Your answers are saved.</span>
          <Button size="sm" onClick={resumeDraft} data-testid="resume-btn">Resume</Button>
          <Button size="sm" variant="ghost" onClick={discardDraft}>Discard</Button>
        </Card>
      )}

      <CareerAssessmentOverview career={career} verified={verified} avg={avg} history={history} />
      <DifficultySelector config={config} focus={focusLevel} onFocus={setFocusLevel} />

      {topRec && (
        <Card className="p-5 mb-6 !bg-indigo/5 border-indigo/25" data-testid="recommended-next">
          <div className="flex items-center gap-2 mb-1.5 text-indigo text-sm font-medium"><Icon name="sparkles" size={15} /> Recommended next assessment</div>
          <div className="flex flex-wrap items-center gap-3">
            <p className="text-sm text-mute flex-1 min-w-[220px]"><b className="text-ink">{topRec.skillName} — {LEVEL_BY_KEY[topRec.level].label}.</b> {topRec.reason}</p>
            <Button size="sm" iconRight="arrow-right" onClick={() => openInstructions(topRec.skillId, topRec.level)} data-testid="start-recommended">Start now</Button>
          </div>
          {recs.length > 1 && <p className="text-xs text-mute mt-3">Also worth doing: {recs.slice(1, 4).map(r => `${r.skillName} (${LEVEL_BY_KEY[r.level].label})`).join(" · ")}</p>}
        </Card>
      )}

      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 className="font-display text-lg font-medium">Skills for {career.name} <span className="text-mute text-sm font-normal">· {career.skills.length} technical skills</span></h3>
        <div className="relative w-full sm:w-64">
          <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-mute" />
          <input value={query} onChange={e => setQuery(e.target.value)} aria-label="Search skills" placeholder="Search skills…"
            className="w-full bg-panel2 border border-line rounded-xl pl-9 pr-3 py-2 text-sm text-ink placeholder:text-mute/60 focus:border-indigo/60" />
        </div>
      </div>
      <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4" data-testid="skill-grid">
        {skills.map(s => <SkillAssessmentCard key={s.id} skill={s} summary={summaries[s.id]} composite={composites[s.id]} config={config} focus={focusLevel}
          recommended={topRec && topRec.skillId === s.id ? topRec.level : null} onStart={openInstructions} />)}
        {skills.length === 0 && <p className="text-sm text-mute col-span-full">No skills match “{query}”.</p>}
      </div>

      <AssessmentHistory history={history} career={career} />

      <Modal open={showSettings} onClose={() => setShowSettings(false)} wide>
        <AssessmentSettings config={config} editable={isAdmin} onClose={() => setShowSettings(false)}
          onSave={async (cfg) => {
            if (useBackendAssess()) { const r = await API.request("PUT", "/api/assessment/config", { config: cfg }); setConfig(normalizeAssessmentConfig(r.config)); }
            else { const c = normalizeAssessmentConfig(cfg); setConfig(c); try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); } catch (e) { /* ignore */ } }
          }} />
      </Modal>
    </div>
  );
}

// ------------------------------------------------------------------------------------------------
function CareerAssessmentOverview({ career, verified, avg, history }) {
  const done = history.filter(h => career.skills.some(s => s.id === h.skillId)).length;
  const tiles = [
    { label: "Technical skills", value: career.skills.length, tone: "text-cyan" },
    { label: "Skills with evidence", value: `${verified}/${career.skills.length}`, tone: "text-good" },
    { label: "Verified proficiency", value: `${avg}%`, tone: "text-indigo" },
    { label: "Attempts completed", value: done, tone: "text-warn" },
  ];
  return (
    <Card className="p-5 md:p-6 mb-5" glow>
      <div className="flex flex-wrap items-center gap-4">
        <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo to-cyan inline-flex items-center justify-center shrink-0"><Icon name="target" size={22} className="text-white" /></div>
        <div className="flex-1 min-w-[200px]">
          <div className="text-xs font-mono text-cyan uppercase tracking-wider">Selected career</div>
          <h2 className="font-display text-xl md:text-2xl font-semibold" data-testid="career-name">{career.name}</h2>
          <p className="text-sm text-mute" data-testid="skill-count-line">{career.skills.length} associated technical skills — assessments are generated from this list.</p>
        </div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
        {tiles.map(t => (
          <div key={t.label} className="rounded-xl bg-panel2/60 border border-line px-4 py-3">
            <div className={`font-mono text-xl font-bold ${t.tone}`}>{t.value}</div>
            <div className="text-xs text-mute">{t.label}</div>
          </div>
        ))}
      </div>
      <p className="text-xs text-mute mt-4">Skills you only <i>declare</i> are not treated as verified. Basic-only results count for 40% of a skill's evidence; Intermediate and Advanced unlock the rest.</p>
    </Card>
  );
}

function DifficultySelector({ config, focus, onFocus }) {
  const cfg = normalizeAssessmentConfig(config).levels;
  return (
    <div className="grid md:grid-cols-3 gap-4 mb-6" role="radiogroup" aria-label="Assessment difficulty" data-testid="difficulty-selector">
      {ASSESSMENT_LEVELS.map(l => {
        const st = LEVEL_STYLE[l.id], c = cfg[l.id], on = focus === l.id;
        return (
          <button key={l.id} type="button" role="radio" aria-checked={on} onClick={() => onFocus(l.id)} data-level={l.id} disabled={!c.enabled}
            className={`text-left rounded-2xl p-5 border-2 transition-all ${on ? `${st.ring} ${st.bg} shadow-glow` : "border-line bg-panel/60 hover:border-cyan/40"} ${c.enabled ? "" : "opacity-40"}`}>
            <div className="flex items-center justify-between mb-2">
              <span className={`font-display font-semibold text-lg ${st.text}`}>{l.label}</span>
              <span className={`w-2.5 h-2.5 rounded-full ${st.dot}`} />
            </div>
            <p className="text-sm text-mute mb-3">{l.desc}</p>
            <div className="flex gap-4 text-xs font-mono text-ink">
              <span>{c.questions} questions</span><span>{c.minutes} min</span><span>pass {c.passPct}%</span>
            </div>
          </button>
        );
      })}
    </div>
  );
}

function SkillAssessmentCard({ skill, summary, composite, config, focus, recommended, onStart }) {
  const lib = SKILL_LIB[skill.id] || {}; const cfg = normalizeAssessmentConfig(config).levels;
  return (
    <Card className="p-5 flex flex-col" data-skill-card={skill.id}>
      <div className="flex items-start justify-between gap-2 mb-1">
        <div className="min-w-0">
          <div className="font-medium text-sm truncate">{skill.name}</div>
          <div className="text-[11px] text-mute font-mono uppercase tracking-wide">{lib.kind ? SKILL_KIND_LABEL_SHORT[lib.kind] : "skill"}</div>
        </div>
        {composite > 0 ? <Badge tone={pctTone(composite)} className="shrink-0">{composite}% verified</Badge> : <Badge tone="mute" className="shrink-0">Not assessed</Badge>}
      </div>
      <div className="space-y-2 mt-3">
        {ASSESSMENT_LEVELS.map(l => {
          const st = LEVEL_STYLE[l.id], s = summary ? summary[l.id] : { attempts: 0 }; const n = poolSize(skill.id, l.id);
          const isRec = recommended === l.id; const isFocus = focus === l.id;
          return (
            <div key={l.id} className={`flex items-center gap-2 rounded-xl border px-3 py-2 ${isFocus ? st.border + " " + st.bg : "border-line"} ${isRec ? "ring-1 ring-cyan/60" : ""}`}>
              <div className="flex-1 min-w-0">
                <div className={`text-xs font-medium ${st.text}`}>{l.label}{isRec && <span className="ml-1.5 text-[10px] text-cyan">· recommended</span>}</div>
                <div className="text-[11px] text-mute">
                  {s.attempts ? <>{s.passed ? <span className="text-good">✓ Passed</span> : <span className="text-warn">Not passed</span>} · best {s.best}% · last {s.last}% · {s.attempts}×</> : <>Not started · {Math.min(n, cfg[l.id].questions)} questions</>}
                </div>
              </div>
              <button type="button" disabled={!cfg[l.id].enabled || n === 0} onClick={() => onStart(skill.id, l.id)} data-start={`${skill.id}:${l.id}`}
                aria-label={`${s.attempts ? "Retake" : "Start"} ${l.label} assessment for ${skill.name}`}
                className="shrink-0 text-xs font-display font-medium px-3 py-1.5 rounded-lg bg-gradient-to-r from-indigo to-cyan text-white hover:brightness-110 disabled:opacity-40">
                {s.attempts ? "Retake" : `${l.label} Assessment`.replace(`${l.label} Assessment`, "Start")}
              </button>
            </div>
          );
        })}
      </div>
    </Card>
  );
}
const SKILL_KIND_LABEL_SHORT = { lang: "Language", fw: "Framework", db: "Database", tool: "Tool", cloud: "Cloud", cs: "Concept" };

// ------------------------------------------------------------------------------------------------
function AssessmentInstructions({ skill, level, config, busy, error, onStart, onBack, summary }) {
  const l = LEVEL_BY_KEY[level], st = LEVEL_STYLE[level], c = normalizeAssessmentConfig(config).levels[level];
  const avail = Math.min(c.questions, questionPool(skill.id, level).filter(q => c.formats.includes(q.type)).length);
  const fmts = ASSESSMENT_FORMATS.filter(f => c.formats.includes(f.id) && questionPool(skill.id, level).some(q => q.type === f.id));
  return (
    <div className="max-w-2xl mx-auto px-4 sm:px-6 py-8 md:py-10" data-testid="instructions">
      <button onClick={onBack} className="flex items-center gap-1.5 text-mute hover:text-ink text-sm mb-6"><Icon name="chevron-left" size={16} /> All assessments</button>
      <Card className="p-6 md:p-8" glow>
        <div className={`text-xs font-mono uppercase tracking-wider ${st.text} mb-1`}>{l.label} assessment</div>
        <h2 className="font-display text-2xl font-semibold mb-1">{skill.name}</h2>
        <p className="text-sm text-mute mb-5">{l.desc}</p>
        <div className="grid grid-cols-3 gap-3 mb-5">
          {[[avail, "questions"], [c.minutes, "minutes"], [`${c.passPct}%`, "to pass"]].map(([v, k]) => (
            <div key={k} className="rounded-xl bg-panel2/60 border border-line py-3 text-center"><div className={`font-mono text-xl font-bold ${st.text}`}>{v}</div><div className="text-xs text-mute">{k}</div></div>
          ))}
        </div>
        <ul className="text-sm text-mute space-y-2 mb-5 list-disc pl-5">
          <li>One question at a time — move back and forward freely; every answer is saved as you go.</li>
          <li>The timer starts when you press Start. When it reaches zero your answers are submitted automatically.</li>
          <li>“Select all” questions need every correct option and no wrong ones. Unanswered questions score zero.</li>
          <li>Formats in this set: {fmts.map(f => f.label).join(", ")}.</li>
          <li>You'll get a topic breakdown and an explanation for every question you missed.</li>
        </ul>
        {summary && summary.attempts > 0 && <p className="text-xs text-mute mb-4">Previous: best {summary.best}%, last {summary.last}% ({summary.attempts} attempt{summary.attempts === 1 ? "" : "s"}). New attempts prefer questions you haven't seen.</p>}
        {avail < c.questions && <p className="text-xs text-warn mb-4">Only {avail} question{avail === 1 ? "" : "s"} are available for this skill and format at the moment.</p>}
        {error && <p className="text-sm text-bad mb-3" role="alert">{error}</p>}
        <div className="flex gap-3">
          <Button onClick={onStart} disabled={busy || avail === 0} iconRight="arrow-right" data-testid="begin-btn">{busy ? "Preparing…" : "Start assessment"}</Button>
          <Button variant="ghost" onClick={onBack}>Cancel</Button>
        </div>
      </Card>
    </div>
  );
}

function AssessmentTimer({ deadline, limitSec, onExpire }) {
  const [left, setLeft] = useState(() => Math.max(0, Math.round((deadline - Date.now()) / 1000)));
  const fired = useRef(false);
  useEffect(() => {
    const t = setInterval(() => {
      const s = Math.max(0, Math.round((deadline - Date.now()) / 1000)); setLeft(s);
      if (s <= 0 && !fired.current) { fired.current = true; onExpire(); }
    }, 1000);
    return () => clearInterval(t);
  }, [deadline]);
  const low = left <= Math.max(30, limitSec * 0.15);
  return (
    <div role="timer" aria-live="off" data-testid="timer" className={`inline-flex items-center gap-2 font-mono text-sm px-3 py-1.5 rounded-lg border ${low ? "border-bad/50 text-bad bg-bad/10" : "border-cyan/30 text-cyan bg-cyan/10"}`}>
      <Icon name="clock" size={14} /> {fmtClock(left)}
    </div>
  );
}

function QuestionRenderer({ q, value, onChange }) {
  const multi = q.type === "multi";
  const picked = multi ? (Array.isArray(value) ? value : []) : value;
  const toggle = (i) => {
    if (multi) onChange(picked.includes(i) ? picked.filter(x => x !== i) : [...picked, i].sort((a, b) => a - b));
    else onChange(value === i ? null : i);
  };
  const label = { mcq: "Single choice", multi: "Select all that apply", tf: "True / False", output: "Predict the output", debug: "Find the bug", scenario: "Scenario" }[q.type];
  return (
    <div data-testid="question" data-qtype={q.type}>
      <div className="flex items-center gap-2 mb-3"><Badge tone="cyan">{label}</Badge><span className="text-[11px] text-mute font-mono">{q.topic}</span></div>
      <p className="font-medium mb-3 whitespace-pre-wrap">{q.q}</p>
      {q.code && <pre className="bg-navy border border-line rounded-xl p-4 text-xs md:text-sm font-mono overflow-x-auto mb-4 text-cyan/90"><code>{q.code}</code></pre>}
      <div className="space-y-2" role={multi ? "group" : "radiogroup"}>
        {q.options.map((opt, i) => {
          const on = multi ? picked.includes(i) : picked === i;
          return (
            <button key={i} type="button" role={multi ? "checkbox" : "radio"} aria-checked={on} data-opt={i} onClick={() => toggle(i)}
              className={`w-full flex items-center gap-3 text-left px-4 py-3 rounded-xl border-2 text-sm transition-colors ${on ? "border-cyan bg-cyan/10" : "border-line hover:border-indigo/40"}`}>
              <span className={`w-5 h-5 shrink-0 inline-flex items-center justify-center border-2 ${multi ? "rounded-md" : "rounded-full"} ${on ? "border-cyan bg-cyan text-navy" : "border-mute/50"}`}>{on && <Icon name="check" size={12} strokeWidth={3} />}</span>
              <span>{opt}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function AssessmentNavigation({ questions, answers, idx, onGo, onSubmit, busy }) {
  const answered = questions.filter(q => isAnswered(answers[q.id])).length; const last = idx === questions.length - 1;
  return (
    <div className="mt-6 space-y-4">
      <div className="flex items-center gap-3">
        <Button variant="secondary" size="sm" icon="chevron-left" disabled={idx === 0} onClick={() => onGo(idx - 1)} data-testid="prev-btn">Previous</Button>
        {!last
          ? <Button size="sm" iconRight="chevron-right" onClick={() => onGo(idx + 1)} data-testid="next-btn">Next</Button>
          : <Button size="sm" iconRight="check" onClick={onSubmit} disabled={busy} data-testid="submit-btn">Submit assessment</Button>}
        <span className="ml-auto text-xs text-mute font-mono">{answered}/{questions.length} answered</span>
      </div>
      <div className="flex flex-wrap gap-1.5" aria-label="Question navigator">
        {questions.map((q, i) => {
          const a = isAnswered(answers[q.id]);
          return <button key={q.id} type="button" onClick={() => onGo(i)} aria-label={`Question ${i + 1}${a ? " answered" : ""}`} aria-current={i === idx} data-nav={i}
            className={`w-8 h-8 rounded-lg text-xs font-mono border transition-colors ${i === idx ? "border-cyan bg-cyan/20 text-cyan" : a ? "border-good/50 bg-good/10 text-good" : "border-line text-mute hover:border-indigo/40"}`}>{i + 1}</button>;
        })}
      </div>
    </div>
  );
}

function AssessmentRunner({ session, skill, answers, idx, busy, error, onAnswer, onGo, onSubmit, onExit }) {
  const [confirm, setConfirm] = useState(false);
  const qs = session.questions; const q = qs[idx]; const st = LEVEL_STYLE[session.level];
  const answered = qs.filter(x => isAnswered(answers[x.id])).length;
  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6 md:py-8" data-testid="runner">
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="flex-1 min-w-[180px]">
          <div className={`text-xs font-mono uppercase tracking-wider ${st.text}`}>{LEVEL_BY_KEY[session.level].label} · {skill.name}</div>
          <div className="text-sm text-mute" data-testid="progress-text">Question {idx + 1} of {qs.length}</div>
        </div>
        <AssessmentTimer deadline={session.deadline} limitSec={session.limitSec} onExpire={() => onSubmit(true)} />
      </div>
      <div className="h-1.5 rounded-full bg-white/5 mb-5 overflow-hidden" role="progressbar" aria-valuemin={0} aria-valuemax={qs.length} aria-valuenow={answered}>
        <div className="h-full bg-gradient-to-r from-indigo to-cyan transition-all" style={{ width: `${(answered / qs.length) * 100}%` }} />
      </div>
      <Card className="p-5 md:p-7">
        <QuestionRenderer key={q.id} q={q} value={answers[q.id]} onChange={(v) => onAnswer(q.id, v)} />
        <AssessmentNavigation questions={qs} answers={answers} idx={idx} onGo={onGo} busy={busy}
          onSubmit={() => (answered < qs.length ? setConfirm(true) : onSubmit(false))} />
      </Card>
      {confirm && (
        <Card className="p-5 mt-4 border-warn/40 !bg-warn/5" role="alertdialog" data-testid="confirm-submit">
          <p className="text-sm mb-3"><b>{qs.length - answered}</b> question{qs.length - answered === 1 ? " is" : "s are"} unanswered and will score zero. Submit anyway?</p>
          <div className="flex gap-3"><Button size="sm" onClick={() => { setConfirm(false); onSubmit(false); }} disabled={busy} data-testid="confirm-yes">Submit now</Button><Button size="sm" variant="secondary" onClick={() => setConfirm(false)}>Keep working</Button></div>
        </Card>
      )}
      {error && <p className="text-sm text-bad mt-3" role="alert">{error}</p>}
      <div className="mt-4"><button onClick={onExit} className="text-xs text-mute hover:text-ink">Leave for now — your progress stays saved and you can resume from the assessment home.</button></div>
    </div>
  );
}

  );
}

function AssessmentSettings({ config, editable, onSave, onClose }) {
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(normalizeAssessmentConfig(config))));
  const [msg, setMsg] = useState(""); const [saving, setSaving] = useState(false);
  const upd = (lvl, k, v) => setDraft(d => ({ levels: { ...d.levels, [lvl]: { ...d.levels[lvl], [k]: v } } }));
  const toggleFmt = (lvl, f) => { const cur = draft.levels[lvl].formats; upd(lvl, "formats", cur.includes(f) ? cur.filter(x => x !== f) : [...cur, f]); };
  const save = async () => { setSaving(true); setMsg(""); try { await onSave(draft); setMsg("Saved."); } catch (e) { setMsg(e.message || "Could not save."); } setSaving(false); };
  const numCls = "w-20 bg-panel2 border border-line rounded-lg px-2 py-1.5 text-sm font-mono text-ink";
  return (
    <div className="p-6" data-testid="settings">
      <h3 className="font-display text-xl font-semibold mb-1">Assessment settings</h3>
      <p className="text-xs text-mute mb-4">{editable ? "Question count, time limit, pass mark and question formats for each level. Changes apply to new attempts." : "Only administrators can change these. Contact your administrator (see ADMIN_EMAILS in the README)."}</p>
      <div className="space-y-4">
        {ASSESSMENT_LEVELS.map(l => { const c = draft.levels[l.id]; return (
          <div key={l.id} className={`rounded-xl border p-4 ${LEVEL_STYLE[l.id].border}`}>
            <div className="flex items-center justify-between mb-3"><span className={`font-medium ${LEVEL_STYLE[l.id].text}`}>{l.label}</span>
              <label className="text-xs text-mute flex items-center gap-2"><input type="checkbox" disabled={!editable} checked={c.enabled} onChange={e => upd(l.id, "enabled", e.target.checked)} /> Enabled</label></div>
            <div className="flex flex-wrap gap-4 text-xs text-mute mb-3">
              <label>Questions <input type="number" min="1" max="50" disabled={!editable} value={c.questions} onChange={e => upd(l.id, "questions", e.target.value)} className={numCls} data-set={`${l.id}-questions`} /></label>
              <label>Minutes <input type="number" min="1" max="180" disabled={!editable} value={c.minutes} onChange={e => upd(l.id, "minutes", e.target.value)} className={numCls} data-set={`${l.id}-minutes`} /></label>
              <label>Pass % <input type="number" min="1" max="100" disabled={!editable} value={c.passPct} onChange={e => upd(l.id, "passPct", e.target.value)} className={numCls} data-set={`${l.id}-pass`} /></label>
            </div>
            <div className="flex flex-wrap gap-2">{ASSESSMENT_FORMATS.map(f => (
              <button key={f.id} type="button" disabled={!editable} onClick={() => toggleFmt(l.id, f.id)} aria-pressed={c.formats.includes(f.id)}
                className={`text-xs px-2.5 py-1 rounded-full border ${c.formats.includes(f.id) ? "border-cyan bg-cyan/10 text-cyan" : "border-line text-mute"}`}>{f.label}</button>))}</div>
          </div>); })}
      </div>
      <div className="flex items-center gap-3 mt-5">
        {editable && <Button onClick={save} disabled={saving} data-testid="save-settings">Save settings</Button>}
        {editable && <Button variant="ghost" onClick={() => setDraft(defaultAssessmentConfig())}>Reset to defaults</Button>}
        <Button variant="secondary" onClick={onClose}>Close</Button>
        {msg && <span className="text-xs text-mute" role="status">{msg}</span>}
      </div>
    </div>
  );
}

const IV_DRAFT_KEY = "skillpilot:interviewDraft";
const ivLoadDraft = () => { try { const d = JSON.parse(localStorage.getItem(IV_DRAFT_KEY) || "null"); return d && d.session && !d.session.done && d.session.startedAt + d.session.limitSec * 1000 > Date.now() ? d : null; } catch (e) { return null; } };
const ivSaveDraft = (d) => { try { d ? localStorage.setItem(IV_DRAFT_KEY, JSON.stringify(d)) : localStorage.removeItem(IV_DRAFT_KEY); } catch (e) { /* ignore */ } };
const ivSpeechRec = () => (typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null);
const IV_DIMS = [["accuracy", "Technical accuracy"], ["understanding", "Conceptual understanding"], ["problemSolving", "Problem-solving"], ["communication", "Communication clarity"], ["practical", "Practical knowledge"], ["completeness", "Completeness"], ["reasoning", "Logical reasoning"]];

function Interview({ profile, career, githubData, resumeData, history, onComplete, lastResult }) {
  const hist = history || [];
  const [phase, setPhase] = useState("home");              // home | config | run | results
  const [cfg, setCfg] = useState(null);
  const [session, setSession] = useState(null);
  const [report, setReport] = useState(null);
  const [viewing, setViewing] = useState(null);             // a saved history entry
  const [draft, setDraft] = useState(() => ivLoadDraft());
  const [busy, setBusy] = useState(false);

  const openConfig = (category, base) => {
    const careerId = (base && base.careerId) || career.id;
    const level = (base && base.level) || "basic";
    setCfg({ ...defaultInterviewConfig(careerId, category, level), ...(base ? { language: base.language || "javascript" } : {}) });
    setPhase("config"); window.scrollTo && window.scrollTo(0, 0);
  };
  const careerFor = (id) => CAREER_BY_ID[id] || career;
  const begin = (config) => {
    const c = careerFor(config.careerId);
    const exclude = hist.filter(h => h.category === config.category && h.careerId === config.careerId).slice(-3).flatMap(h => (h.questions || []).map(q => q.qid)).filter(Boolean);
    const s = startInterview(config, { career: c, githubData, resumeData, profile }, { seed: `${config.careerId}:${config.category}:${config.level}:${Date.now()}:${Math.random()}`, exclude });
    setSession(s); setReport(null); setPhase("run"); ivSaveDraft({ session: s, text: "", code: "", expl: "" }); window.scrollTo && window.scrollTo(0, 0);
  };
  const resume = () => { setSession(draft.session); setPhase("run"); };
  const finish = (s, timedOut) => {
    const r = buildInterviewReport(s, { timedOut });
    const entry = interviewHistoryEntry(s, r, { id: "iv-" + Date.now(), at: new Date().toISOString() });
    const prev = hist.filter(h => h.category === s.config.category && h.level === s.config.level && h.careerId === s.config.careerId).slice(-1)[0] || null;
    ivSaveDraft(null); setDraft(null); setReport({ ...r, entry, prev, session: s }); setPhase("results"); onComplete(entry); window.scrollTo && window.scrollTo(0, 0);
  };
  const home = () => { setPhase("home"); setSession(null); setReport(null); setViewing(null); setDraft(ivLoadDraft()); };

  if (phase === "config" && cfg) return <InterviewConfiguration cfg={cfg} setCfg={setCfg} career={career} profile={profile} githubData={githubData} resumeData={resumeData} onBack={home} onStart={() => begin(normalizeInterviewConfig(cfg))} />;
  if (phase === "run" && session) return <InterviewWorkspace session={session} setSession={setSession} onFinish={finish} onExit={home} />;
  if (phase === "results" && report) return <InterviewResults report={report} history={hist} onRetry={() => openConfig(report.session.config.category, report.session.config)} onBack={home} />;
  if (viewing) return <InterviewResults saved={viewing} history={hist} onRetry={() => openConfig(viewing.category, { careerId: viewing.careerId, level: viewing.level, language: viewing.language })} onBack={() => setViewing(null)} />;

  return <InterviewDashboard career={career} history={hist} draft={draft} lastResult={lastResult} onPick={openConfig} onResume={resume}
    onDiscard={() => { ivSaveDraft(null); setDraft(null); }} onView={setViewing} onRetry={(h) => openConfig(h.category, { careerId: h.careerId, level: h.level, language: h.language })} />;
}

function AnswerInput({ value, onChange, voice, disabled }) {
  const [listening, setListening] = useState(false); const recRef = useRef(null);
  const SR = ivSpeechRec();
  const toggle = () => {
    if (listening && recRef.current) { recRef.current.stop(); return; }
    if (!SR) return;
    const r = new SR(); r.continuous = true; r.interimResults = false; r.lang = "en-US";
    r.onresult = (e) => { let t = ""; for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript + " "; if (t) onChange((value ? value.trim() + " " : "") + t.trim()); };
    r.onend = () => setListening(false); r.onerror = () => setListening(false);
    recRef.current = r; setListening(true); r.start();
  };
  useEffect(() => () => { try { recRef.current && recRef.current.stop(); } catch (e) { /* ignore */ } }, []);
  return (
    <div>
      <textarea value={value} onChange={e => onChange(e.target.value)} disabled={disabled} data-testid="iv-answer" aria-label="Your answer"
        placeholder="Type your answer as you would say it in a real interview…"

      <div className="flex items-center justify-between mt-1.5 text-[11px] text-mute">
        <span>{value.trim().split(/\s+/).filter(Boolean).length} words</span>
        {voice && SR && <button type="button" onClick={toggle} className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border ${listening ? "border-bad text-bad" : "border-line hover:text-ink"}`} data-testid="mic-btn">{listening ? "● Stop dictation" : "🎤 Dictate answer"}</button>}
      </div>
    </div>
  );
}

function InterviewWorkspace({ session, setSession, onFinish, onExit }) {
  const q = session.current; const cfg = session.config;
  const [text, setText] = useState(() => (ivLoadDraft() || {}).text || "");
  const [code, setCode] = useState(() => (ivLoadDraft() || {}).code || (q && q.type === "coding" ? codingStarter(q.coding.id, cfg.language) : ""));
  const [expl, setExpl] = useState(() => (ivLoadDraft() || {}).expl || "");
  const [runResult, setRunResult] = useState(null); const [running, setRunning] = useState(false); const [busy, setBusy] = useState(false);
  const [confirmEnd, setConfirmEnd] = useState(false); const [speaking, setSpeaking] = useState(false);
  const deadline = session.startedAt + session.limitSec * 1000;
  const voice = cfg.mode === "voice";

  useEffect(() => { ivSaveDraft({ session, text, code, expl }); }, [session, text, code, expl]);
  useEffect(() => {   // read the question aloud in voice mode
    if (!voice || !q || typeof window === "undefined" || !window.speechSynthesis) return;
    try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(q.q).split("\n")[0]); u.onstart = () => setSpeaking(true); u.onend = () => setSpeaking(false); window.speechSynthesis.speak(u); } catch (e) { /* ignore */ }
    return () => { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } };
  }, [q && q.id]);

  const advance = (next) => {
    setText(""); setExpl(""); setRunResult(null);
    setCode(next.current && next.current.type === "coding" ? codingStarter(next.current.coding.id, cfg.language) : "");
    if (next.done) onFinish(next, false); else setSession(next);
  };
  const run = async () => { setRunning(true); const r = await runJsTests(code, q.coding.id); setRunResult(r); setRunning(false); return r; };
  const submit = async (skip) => {
    if (busy || !q) return; setBusy(true);
    let next;
    if (q.type === "coding") {
      let r = runResult; if (!skip && cfg.language === "javascript" && code.trim()) r = await run();
      next = submitTurn(session, skip ? "" : { code, explanation: expl, language: cfg.language, run: cfg.language === "javascript" ? r : null }, { skip });
    } else next = submitTurn(session, text, { skip });
    setBusy(false); advance(next);
  };
  const timeUp = () => { const s = submitTurn(session, q && q.type === "coding" ? { code, explanation: expl, language: cfg.language } : text, { finish: true }); onFinish({ ...s, done: true }, true); };
  const endNow = () => { const has = q && (q.type === "coding" ? code.trim() : text.trim()); const s = has ? submitTurn(session, q.type === "coding" ? { code, explanation: expl, language: cfg.language } : text, { finish: true }) : session; onFinish({ ...s, done: true }, false); };
  const answered = session.turns.length;
  const canSubmit = q && (q.type === "coding" ? code.trim() && !/^\s*$/.test(code) : text.trim().length > 0);

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 md:py-8" data-testid="iv-workspace">
      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="flex-1 min-w-[220px]"><div className="text-xs font-mono uppercase tracking-wider text-cyan">{INTERVIEW_CATEGORY_BY_ID[cfg.category].label} · {session.careerName}</div>
          <InterviewProgress done={answered} total={session.total} current={answered + 1} /></div>
        <InterviewTimer deadline={deadline} limitSec={session.limitSec} onExpire={timeUp} />
      </div>
      <div className="grid lg:grid-cols-[320px_1fr] gap-5">
        <AIInterviewer session={session} speaking={speaking} thinking={busy} />
        <div className="space-y-4">
          {q && <QuestionPanel q={q} n={answered + 1} total={session.total} level={q.level || cfg.level} />}
          {q && (q.type === "coding"
            ? <CodingEditor q={q} language={cfg.language} code={code} setCode={setCode} expl={expl} setExpl={setExpl} runResult={runResult} running={running} onRun={run} />
            : <AnswerInput value={text} onChange={setText} voice={voice} disabled={busy} />)}
          <div className="flex flex-wrap items-center gap-3">
            <Button onClick={() => submit(false)} disabled={busy || !canSubmit} iconRight="send" data-testid="iv-submit">{busy ? "Evaluating…" : "Submit answer"}</Button>
            <Button variant="secondary" onClick={() => submit(true)} disabled={busy} data-testid="iv-skip">Skip question</Button>

    </div>
  );
}
